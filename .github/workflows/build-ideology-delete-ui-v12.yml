name: Build Ideology Delete UI 1.5 v1.2

on:
  pull_request:
    paths:
      - 'Ideology-Delete-UI-1.5/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Ideology-Delete-UI-1.5/Source/IdeologyDeleteUI.csproj
      - run: dotnet build Ideology-Delete-UI-1.5/Source/IdeologyDeleteUI.csproj -c Release --no-restore
      - shell: bash
        run: |
          set -euxo pipefail
          rm -rf out
          mkdir -p out/Ideology_Delete_UI_1.5_v1.2/1.5/Assemblies out/Ideology_Delete_UI_1.5_v1.2/About
          cp Ideology-Delete-UI-1.5/Source/bin/Release/net472/IdeologyDeleteUI.dll out/Ideology_Delete_UI_1.5_v1.2/1.5/Assemblies/
          cp Ideology-Delete-UI-1.5/About/About.xml out/Ideology_Delete_UI_1.5_v1.2/About/
          cp Ideology-Delete-UI-1.5/README.md out/Ideology_Delete_UI_1.5_v1.2/
          cd out && zip -r Ideology_Delete_UI_1.5_v1.2.zip Ideology_Delete_UI_1.5_v1.2
      - uses: actions/upload-artifact@v4
        with:
          name: Ideology_Delete_UI_1.5_v1.2
          path: |
            out/Ideology_Delete_UI_1.5_v1.2.zip
            out/Ideology_Delete_UI_1.5_v1.2/1.5/Assemblies/IdeologyDeleteUI.dll
