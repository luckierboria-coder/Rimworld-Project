name: Build RimMT V0.9.3-T27.7 Dead Path Retirement

on:
  push:
    branches:
      - rimmt-v0.9.3-t27.7-dead-path-retirement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build verified T27.6 baseline
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT27_6_Final.ps1
      - name: Apply and verify T27.7
        shell: pwsh
        run: ./RimMT/Build/FinalizeRimMTT27_7.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T27.7-Dead-Path-Retirement
          path: |
            build/RimMT_V0.9.3_T27.7_Production.zip
            build/RimMT_Diagnostics_v0.4.zip
            build/RimMT_T27.7_With_Diagnostics_Bundle.zip
          if-no-files-found: error
