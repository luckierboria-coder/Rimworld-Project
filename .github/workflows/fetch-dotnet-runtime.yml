name: Fetch Dotnet Runtime Recovery Tool

on:
  push:
    branches: [ rimmt-v0.9.0-rc1 ]
    paths:
      - '.github/workflows/fetch-dotnet-runtime.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install .NET 10 runtime locally
        run: |
          curl -L https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --runtime dotnet --version 10.0.11 --install-dir ./dotnet-runtime
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-10-linux-x64
          path: dotnet-runtime
          include-hidden-files: true
          if-no-files-found: error
