name: Build RimMT V0.9.3-T27.1 Work Plan Window

on:
  push:
    branches: [ rimmt-v0.9.3-t27.1-work-plan-window ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t27-1.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t27-1-work-plan-window
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T27.1
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT27_1.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T27.1-Work-Plan-Window
          path: build/RimMT_V0.9.3_T27.1_Work_Plan_Window.zip
          if-no-files-found: error
