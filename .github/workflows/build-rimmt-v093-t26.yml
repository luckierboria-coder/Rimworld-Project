name: Build RimMT V0.9.3-T26 Engine Parallel

on:
  push:
    branches: [ rimmt-v0.9.3-t26-engine-parallel ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t26.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t26-engine-parallel
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply V22 Stable transforms
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanTransforms.ps1
      - name: Apply V23 S4 pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV23S4Pruners.ps1
      - name: Apply V24 S4 telemetry and pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV24S4TelemetryAndPruners.ps1
      - name: Apply V26 Consolidated Stable marker
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV26Consolidated.ps1
      - name: Apply T0 Tail Observatory
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T0TailObservatory.ps1
      - name: Apply T1 Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1TailAttribution.ps1
      - name: Apply T1A no-global-fuse policy
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1ANoGlobalFuse.ps1
      - name: Apply T2 Pawn Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T2PawnTailAttribution.ps1
      - name: Apply T3 bounded FindPath layer
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T3HeavyWorkGiverEarlyRescue.ps1
      - name: Apply T4 HaulMerge partner index and revert generic early rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T4HaulMergePartnerIndex.ps1
      - name: Apply T5 measurement-only HaulMerge Harmony census
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T5HaulMergePatchCensus.ps1
      - name: Apply T8 clean T5 carrier/mech cheap negatives
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T8T5CarrierPruners.ps1
      - name: Apply T13 PawnTick aggregate attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T13PawnTickAggregateAttribution.ps1
      - name: Apply T14 PlayerHuman residual attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T14PlayerHumanResidualAttribution.ps1
      - name: Apply T15 WorkGiver deep attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T15WorkGiverDeepAttribution.ps1
      - name: Apply T16 GenClosest deep attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T16GenClosestDeepAttribution.ps1
      - name: Apply T17 HaulUrgently dynamic rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T17HaulUrgentlyDynamicRescue.ps1
      - name: Apply T18 mobile-source rescue and Storyteller deep burst
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T18MobileSourceRescueStorytellerDeep.ps1
      - name: Apply T19 quest deep and mobile-global rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T19QuestDeepMobileGlobalRescue.ps1
      - name: Apply T20 foundation transaction core
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T20FoundationTransactionCore.ps1
      - name: Apply T21 chain-aware Reachability foundation
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T21FoundationReachChain.ps1
      - name: Apply T22 Foundation III GenClosest + SMF bridge
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T22FoundationGenClosestSMF.ps1
      - name: Apply T23 tail containment + WorldRoot consolidation
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T23TailContainmentCompat.ps1
      - name: Finalize T23 generated sources
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T23Finalize.ps1
      - name: Apply T24 Stutter First production changes
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T24StutterFirst.ps1
      - name: Apply T24.1 generic Def safety hotfix
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T24_1GenericDefSafety.ps1
      - name: Apply T26 Engine Parallel framework
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T26EngineParallel.ps1

      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify T26 safety and engine-parallel contract
        shell: pwsh
        run: |
          $boot = Get-Content 'RimMT/Source/RimMT/Bootstrap/RimMTBootstrap.cs' -Raw
          if ($boot -notmatch '0\.9\.3-t26-engine-parallel') { throw 'Bootstrap is not T26.' }
          foreach ($marker in @('SimulationEpochCoordinator093T26.Apply','SingleCallCandidatePartition.Apply')) {
            if ($boot -notmatch [regex]::Escape($marker)) { throw "T26 bootstrap marker missing: $marker" }
          }
          if ($boot -match 'AsyncJobCandidatePlan04182.Apply' -or $boot -match 'JobDecisionRootAttribution093T25.Apply') {
            throw 'T25 experimental cache/ThinkNode attribution leaked into T26.'
          }

          $root = Get-Content 'RimMT/Source/RimMT/Diagnostics/WorldRootAttribution093T22.cs' -Raw
          if ($root -notmatch 'genericHarmony=OFF') { throw 'T24.1 generic Harmony OFF marker missing.' }
          $applyStart = $root.IndexOf('internal static void Apply(Harmony harmony)')
          $applyEnd = $root.IndexOf('private static void PatchWorldComponentOverrides', $applyStart)
          $apply = $root.Substring($applyStart, $applyEnd - $applyStart)
          if ($apply -match 'PatchTraitDefDatabaseSignals\(harmony\)') { throw 'Closed-generic DefDatabase patch returned.' }

          $epoch = Get-Content 'RimMT/Source/RimMT/Scheduling/SimulationEpochCoordinator093T26.cs' -Raw
          foreach ($marker in @('DoSingleTick','scheduler.ParallelFor','MainThreadBudgetMs = 0.40','private unpublished array','timeout never blocks')) {
            if ($epoch -notmatch [regex]::Escape($marker)) { throw "T26 epoch marker missing: $marker" }
          }
          $kernelStart = $epoch.IndexOf('internal static bool TryComputeRingKeys')
          $kernelEnd = $epoch.IndexOf('internal static string Summary()', $kernelStart)
          if ($kernelStart -lt 0 -or $kernelEnd -lt 0) { throw 'Cannot isolate T26 primitive worker kernel.' }
          $kernel = $epoch.Substring($kernelStart, $kernelEnd - $kernelStart)
          foreach ($forbidden in @('.Position','.Map','CanReach','JobOnThing','Reserve(','done.Wait','Thing ','Pawn ')) {
            if ($kernel -match [regex]::Escape($forbidden)) { throw "Unsafe worker-kernel token: $forbidden" }
          }

          $part = Get-Content 'RimMT/Source/RimMT/AI/SingleCallCandidatePartition.cs' -Raw
          foreach ($marker in @('FeatureId = "parallel.engineStage"','MinCandidateCount = 256','WorkerAssistMinCount = 256','TailAdmissionTicks','SimulationEpochCoordinator093T26.TryComputeRingKeys')) {
            if ($part -notmatch [regex]::Escape($marker)) { throw "T26 partition marker missing: $marker" }
          }
          if ($part -match 'done\.Wait\(') { throw 'T26 regression: candidate partition can still wait indefinitely.' }

          $proj = Get-Content 'RimMT/Source/RimMT/RimMT.csproj' -Raw
          if ($proj -match '<Compile Remove="AI\\SingleCallCandidatePartition\.cs"') { throw 'T26 partition is still excluded from compilation.' }

          $runtime = Get-Content 'RimMT/Source/RimMT/Core/RimMTRuntime.cs' -Raw
          foreach ($marker in @('SimulationEpochCoordinator093T26.FeatureId','SingleCallCandidatePartition.MarkCompatibilityReady')) {
            if ($runtime -notmatch [regex]::Escape($marker)) { throw "T26 runtime marker missing: $marker" }
          }

          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') { throw "Unexpected DLL set: $($packDlls.Name -join ', ')" }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.9.3_T26_Engine_Parallel.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T26-Engine-Parallel
          path: build/RimMT_V0.9.3_T26_Engine_Parallel.zip
          if-no-files-found: error
