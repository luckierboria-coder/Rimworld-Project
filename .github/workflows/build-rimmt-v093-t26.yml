name: Build RimMT V0.9.3-T26.1 Zero-Wait FightFires

on:
  push:
    branches: [ rimmt-v0.9.3-t26-1-zero-wait-fightfires ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t26.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t26-1-zero-wait-fightfires
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T26.1
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT26_1.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T26.1-Zero-Wait-FightFires
          path: build/RimMT_V0.9.3_T26.1_Zero_Wait_FightFires.zip
          if-no-files-found: error
