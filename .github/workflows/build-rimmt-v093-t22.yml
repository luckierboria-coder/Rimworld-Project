name: Build RimMT V0.9.3-T22 Foundation III GenClosest SMF

on:
  push:
    branches: [ rimmt-v0.9.3-t22-foundation-genclosest-smf ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t22.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t22
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply transform chain
        shell: pwsh
        run: |
          $steps = @(
            'ApplyUnifiedLeanTransforms.ps1',
            'ApplyUnifiedLeanV23S4Pruners.ps1',
            'ApplyUnifiedLeanV24S4TelemetryAndPruners.ps1',
            'ApplyUnifiedLeanV26Consolidated.ps1',
            'ApplyRimMTV093T0TailObservatory.ps1',
            'ApplyRimMTV093T1TailAttribution.ps1',
            'ApplyRimMTV093T1ANoGlobalFuse.ps1',
            'ApplyRimMTV093T2PawnTailAttribution.ps1',
            'ApplyRimMTV093T3HeavyWorkGiverEarlyRescue.ps1',
            'ApplyRimMTV093T4HaulMergePartnerIndex.ps1',
            'ApplyRimMTV093T5HaulMergePatchCensus.ps1',
            'ApplyRimMTV093T8T5CarrierPruners.ps1',
            'ApplyRimMTV093T13PawnTickAggregateAttribution.ps1',
            'ApplyRimMTV093T14PlayerHumanResidualAttribution.ps1',
            'ApplyRimMTV093T15WorkGiverDeepAttribution.ps1',
            'ApplyRimMTV093T16GenClosestDeepAttribution.ps1',
            'ApplyRimMTV093T17HaulUrgentlyDynamicRescue.ps1',
            'ApplyRimMTV093T18MobileSourceRescueStorytellerDeep.ps1',
            'ApplyRimMTV093T19QuestDeepMobileGlobalRescue.ps1',
            'ApplyRimMTV093T20FoundationTransactionCore.ps1',
            'ApplyRimMTV093T21FoundationReachChain.ps1',
            'ApplyRimMTV093T22FoundationGenClosestSMF.ps1'
          )
          foreach ($s in $steps) { & (Join-Path 'RimMT/Build' $s) }

          # Compile-shape fix for the generated T22 source: JobIssueParams lives in Verse.AI.
          $genPath = 'RimMT/Source/RimMT/AI/GenClosestTransactionIndex093T22.cs'
          $gen = Get-Content $genPath -Raw
          if ($gen -notmatch 'using Verse\.AI;') {
            $gen = $gen.Replace("using Verse;`r`n", "using Verse;`r`nusing Verse.AI;`r`n")
            if ($gen -notmatch 'using Verse\.AI;') {
              $gen = $gen.Replace("using Verse;`n", "using Verse;`nusing Verse.AI;`n")
            }
            Set-Content $genPath $gen -Encoding UTF8
          }

      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify T22 safety contract
        shell: pwsh
        run: |
          $boot = Get-Content 'RimMT/Source/RimMT/Bootstrap/RimMTBootstrap.cs' -Raw
          foreach ($marker in @(
            '0.9.3-t22-foundation-genclosest-smf',
            'JobSearchTransaction093T20.Apply(harmony)',
            'GenClosestTransactionIndex093T22.Apply(harmony)',
            'WorldTailBoundary093T22.Apply(harmony)',
            'typeof(Root_Play), "Update"',
            'RootPlayUpdatePrefix','RootPlayUpdatePostfix')) {
            if (-not $boot.Contains($marker)) { throw "T22 bootstrap marker missing: $marker" }
          }
          if ($boot -match 'CompatibilityGuard\.RegisterTarget\("runtime\.dispatcher"') { throw 'Dispatcher must not be guarded through TickManager/Root_Play foreign patch census.' }
          if ($boot -match 'TickManagerUpdatePrefix|TickManagerUpdatePostfix') { throw 'Legacy TickManager dispatcher hook remains.' }

          $core = Get-Content 'RimMT/Source/RimMT/AI/JobSearchTransaction093T20.cs' -Raw
          foreach ($marker in @('T21 Foundation II','ReachBasePostfix','reachChainAuthoritativeSafe')) {
            if (-not $core.Contains($marker)) { throw "T21 core marker missing: $marker" }
          }

          $gen = Get-Content 'RimMT/Source/RimMT/AI/GenClosestTransactionIndex093T22.cs' -Raw
          foreach ($marker in @(
            'using Verse.AI;','ClosestThing_Global_NewTemp','MinSourceCount = 32',
            'firstObservationBypass','CandidateIndex.Build','FingerprintMatches','Array.Sort',
            'priorityGetter != null','lookInHaulSources','__runOriginal','chainAuthoritativeSafe',
            'sorted by distance then source order')) {
            if (-not $gen.Contains($marker)) { throw "T22 GenClosest marker missing: $marker" }
          }
          if ($gen -match 'Task\.|ThreadPool|JobScheduler|Parallel\.') { throw 'T22 GenClosest path must remain synchronous.' }
          if ($gen -match 'ReservationManager|JobOnThing\(') { throw 'T22 GenClosest path must not cache job/reservation semantics.' }

          $world = Get-Content 'RimMT/Source/RimMT/Diagnostics/WorldTailBoundary093T22.cs' -Raw
          if (-not $world.Contains('WorldComponentUtility')) { throw 'WorldComponentUtility direct timing missing.' }
          if (-not $world.Contains('measurement-only')) { throw 'World timing must remain measurement-only.' }

          $smf = Get-Content 'RimMT/Source/RimMT/Diagnostics/SMFDispatcherCoexistence093T16.cs' -Raw
          if (-not $smf.Contains('T22 SMF dispatcher bridge audit')) { throw 'T22 SMF audit missing.' }
          if (-not $smf.Contains('bridgeTarget=Root_Play.Update')) { throw 'Root_Play bridge audit marker missing.' }
          if (-not $smf.Contains('TickManagerUpdate as runtime.dispatcher authority')) { throw 'SMF non-ownership policy missing.' }

          $report = Get-Content 'RimMT/Source/RimMT/Diagnostics/RimMTDiagnostics.cs' -Raw
          foreach ($marker in @('V0.9.3-T22 Foundation III GenClosest + SMF Bridge','GenClosestTransactionIndex093T22.Summary()','WorldTailBoundary093T22.Summary()','Root_Play.Update')) {
            if (-not $report.Contains($marker)) { throw "T22 report marker missing: $marker" }
          }

          $reach = Get-Content 'RimMT/Source/RimMT/AI/AggressiveReachabilityProfilesV17.cs' -Raw
          if ($reach -notmatch 'globalFuse=OFF') { throw 'ReachProfile no-global-fuse policy missing.' }

          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') { throw "Unexpected DLL set: $($packDlls.Name -join ', ')" }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.9.3_T22_Foundation_III_GenClosest_SMF.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T22-Foundation-III-GenClosest-SMF
          path: build/RimMT_V0.9.3_T22_Foundation_III_GenClosest_SMF.zip
          if-no-files-found: error
