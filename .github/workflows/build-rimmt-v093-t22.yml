name: Build RimMT V0.9.3-T22 Foundation III GenClosest SMF

on:
  push:
    branches: [ rimmt-v0.9.3-t22-foundation-genclosest-smf ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t22.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t22
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply V22 Stable transforms
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanTransforms.ps1
      - name: Apply V23 S4 pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV23S4Pruners.ps1
      - name: Apply V24 S4 telemetry and pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV24S4TelemetryAndPruners.ps1
      - name: Apply V26 Consolidated Stable marker
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV26Consolidated.ps1
      - name: Apply T0 Tail Observatory
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T0TailObservatory.ps1
      - name: Apply T1 Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1TailAttribution.ps1
      - name: Apply T1A no-global-fuse policy
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1ANoGlobalFuse.ps1
      - name: Apply T2 Pawn Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T2PawnTailAttribution.ps1
      - name: Apply T3 bounded FindPath layer
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T3HeavyWorkGiverEarlyRescue.ps1
      - name: Apply T4 HaulMerge partner index and revert T3 early rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T4HaulMergePartnerIndex.ps1
      - name: Apply T5 measurement-only HaulMerge Harmony census
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T5HaulMergePatchCensus.ps1
      - name: Apply T8 clean T5 carrier/mech cheap negatives
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T8T5CarrierPruners.ps1
      - name: Apply T13 PawnTick aggregate attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T13PawnTickAggregateAttribution.ps1
      - name: Apply T14 PlayerHuman residual attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T14PlayerHumanResidualAttribution.ps1
      - name: Apply T15 WorkGiver deep attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T15WorkGiverDeepAttribution.ps1
      - name: Apply T16 GenClosest deep attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T16GenClosestDeepAttribution.ps1
      - name: Apply T17 HaulUrgently dynamic rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T17HaulUrgentlyDynamicRescue.ps1
      - name: Apply T18 mobile-source rescue and Storyteller deep burst
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T18MobileSourceRescueStorytellerDeep.ps1
      - name: Apply T19 quest deep and mobile-global rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T19QuestDeepMobileGlobalRescue.ps1
      - name: Apply T20 foundation transaction core
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T20FoundationTransactionCore.ps1
      - name: Apply T21 chain-aware Reachability foundation
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T21FoundationReachChain.ps1
      - name: Apply T22 GenClosest foundation and SMF bridge
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T22FoundationGenClosestSMF.ps1

      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify T22 foundation safety contract
        shell: pwsh
        run: |
          $boot = Get-Content 'RimMT/Source/RimMT/Bootstrap/RimMTBootstrap.cs' -Raw
          if ($boot -notmatch '0\.9\.3-t22-foundation-genclosest-smf') { throw 'Bootstrap is not T22.' }
          if ($boot -notmatch 'JobSearchTransaction093T20\.Apply\(harmony\)') { throw 'T20/T21 transaction core missing.' }
          if ($boot -notmatch 'GenClosestTransactionIndex093T22\.Apply\(harmony\)') { throw 'T22 GenClosest index missing.' }
          if ($boot -notmatch 'WorldTailBoundary093T22\.Apply\(harmony\)') { throw 'T22 WorldTick boundary missing.' }
          if ($boot -notmatch 'typeof\(Root_Play\).*"Update"') { throw 'T22 dispatcher is not on Root_Play.Update.' }
          if ($boot -match 'CompatibilityGuard\.RegisterTarget\("runtime\.dispatcher"') { throw 'T22 must not register TickManagerUpdate/Root_Play as a blocking dispatcher authority target.' }
          if ($boot -match 'TickManagerUpdatePrefix|TickManagerUpdatePostfix') { throw 'Legacy TickManager dispatcher hooks must be absent.' }
          if ($boot -notmatch 'RootPlayUpdatePrefix|RootPlayUpdatePostfix') { throw 'Root_Play dispatcher bridge methods missing.' }

          $core = Get-Content 'RimMT/Source/RimMT/AI/JobSearchTransaction093T20.cs' -Raw
          if ($core -notmatch 'T21 Foundation II') { throw 'T21 chain-aware reach core lost.' }
          if ($core -notmatch 'ReachBasePostfix') { throw 'T21 base-result reach capture lost.' }
          if ($core -notmatch 'reachChainAuthoritativeSafe') { throw 'T21 reach chain safety lost.' }

          $gen = Get-Content 'RimMT/Source/RimMT/AI/GenClosestTransactionIndex093T22.cs' -Raw
          foreach ($marker in @(
            'ClosestThing_Global_NewTemp','one synchronous JobGiver_Work package','MinSourceCount = 32',
            'firstObservationBypass','CandidateIndex.Build','FingerprintMatches','Array.Sort',
            'priorityGetter != null','lookInHaulSources','__runOriginal','chainAuthoritativeSafe',
            'sorted by distance then source order','original live validator is called exactly once per visited candidate')) {
            if ($gen -notmatch [regex]::Escape($marker)) { throw "T22 GenClosest marker missing: $marker" }
          }
          if ($gen -match 'Task\.|ThreadPool|JobScheduler|Parallel\.') { throw 'T22 GenClosest core must remain synchronous/main-thread only.' }
          if ($gen -match 'ReservationManager|JobOnThing\(') { throw 'T22 GenClosest core must not cache job/reservation decisions.' }

          $world = Get-Content 'RimMT/Source/RimMT/Diagnostics/WorldTailBoundary093T22.cs' -Raw
          if ($world -notmatch 'WorldTailBoundary093T22') { throw 'T22 world boundary source missing.' }
          if ($world -notmatch 'WorldComponentUtility') { throw 'T22 WorldComponentUtility timing missing.' }
          if ($world -notmatch 'measurement-only') { throw 'T22 world boundary must remain measurement-only.' }

          $smf = Get-Content 'RimMT/Source/RimMT/Diagnostics/SMFDispatcherCoexistence093T16.cs' -Raw
          if ($smf -notmatch 'T22 SMF dispatcher bridge audit') { throw 'T22 SMF audit missing.' }
          if ($smf -notmatch 'bridgeTarget=Root_Play.Update') { throw 'T22 SMF bridge target marker missing.' }
          if ($smf -notmatch 'TickManagerUpdate as runtime.dispatcher authority') { throw 'T22 SMF non-ownership policy missing.' }

          $report = Get-Content 'RimMT/Source/RimMT/Diagnostics/RimMTDiagnostics.cs' -Raw
          if ($report -notmatch 'V0\.9\.3-T22 Foundation III GenClosest \+ SMF Bridge') { throw 'T22 report title missing.' }
          if ($report -notmatch 'GenClosestTransactionIndex093T22\.Summary\(\)') { throw 'T22 GenClosest summary missing.' }
          if ($report -notmatch 'WorldTailBoundary093T22\.Summary\(\)') { throw 'T22 WorldTick summary missing.' }
          if ($report -notmatch 'Root_Play.Update') { throw 'T22 SMF production policy missing.' }

          $reach = Get-Content 'RimMT/Source/RimMT/AI/AggressiveReachabilityProfilesV17.cs' -Raw
          if ($reach -notmatch 'globalFuse=OFF') { throw 'No-global-fuse ReachProfile policy missing.' }

          $detail = Get-Content 'RimMT/Source/RimMT/Patches/WorkGiverDetailPatches.cs' -Raw
          if ($detail -notmatch 'CaptureJobPackages = 64') { throw 'Bounded T15/T16 diagnostic window lost its 64-package bound.' }

          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') { throw "Unexpected DLL set: $($packDlls.Name -join ', ')" }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.9.3_T22_Foundation_III_GenClosest_SMF.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T22-Foundation-III-GenClosest-SMF
          path: build/RimMT_V0.9.3_T22_Foundation_III_GenClosest_SMF.zip
          if-no-files-found: error
