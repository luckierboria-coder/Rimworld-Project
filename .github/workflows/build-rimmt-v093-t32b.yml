name: Build RimMT V0.9.3-T32B Lazy Validator Fingerprint

on:
  push:
    branches:
      - rimmt-v0.9.3-t32b-lazy-validator-fingerprint
  pull_request:
    branches:
      - rimmt-v0.9.3-t32a-reservation-transaction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t32b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T32-B
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT32B.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T32B-Lazy-Validator-Fingerprint
          path: |
            build/RimMT_V0.9.3_T32B_Production.zip
            build/RimMT_Diagnostics_v0.11.zip
            build/RimMT_T32B_With_Diagnostics_Bundle.zip
          if-no-files-found: error
