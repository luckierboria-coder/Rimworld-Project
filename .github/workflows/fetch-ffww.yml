name: Fetch FFWW
on:
  push:
    branches: [fight-fires-water-15-backport]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-water-15-backport
      - name: Install SteamCMD
        run: |
          mkdir -p "$GITHUB_WORKSPACE/steamcmd"
          curl -L --retry 3 -o /tmp/steamcmd_linux.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf /tmp/steamcmd_linux.tar.gz -C "$GITHUB_WORKSPACE/steamcmd"
      - name: Download Workshop items
        run: |
          "$GITHUB_WORKSPACE/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 294100 3631692625 validate +workshop_download_item 294100 836308268 validate +quit
          cp -a "$HOME/Steam/steamapps/workshop/content/294100/3631692625" "$GITHUB_WORKSPACE/FFWW-original"
          cp -a "$HOME/Steam/steamapps/workshop/content/294100/836308268" "$GITHUB_WORKSPACE/DBH-original"
          find "$GITHUB_WORKSPACE/DBH-original" -path '*1.5*' -type f -print | head -100
      - name: Upload originals
        uses: actions/upload-artifact@v4
        with:
          name: FFWW-DBH-originals
          path: |
            FFWW-original
            DBH-original
