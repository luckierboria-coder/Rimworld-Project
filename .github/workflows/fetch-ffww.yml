name: Build FFWW 1.5 Backport
on:
  push:
    branches: [fight-fires-water-15-backport]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-water-15-backport
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rehydrate source
        shell: bash
        run: |
          rm -rf FFWW-1.5
          mkdir -p FFWW-1.5
          echo '' | base64 -d | tar -xzf - -C FFWW-1.5
      - name: Build exact RimWorld 1.5.4063
        run: |
          cd FFWW-1.5/Source
          dotnet restore FightFiresWithWater.csproj
          dotnet build FightFiresWithWater.csproj -c Release --no-restore
      - name: Validate and package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('FFWW-1.5')
          for p in root.rglob('*.xml'): ET.parse(p)
          en=ET.parse(root/'Languages/English/Keyed/FFWW.xml').getroot()
          zh=ET.parse(root/'Languages/ChineseSimplified/Keyed/FFWW.xml').getroot()
          assert {x.tag for x in en} == {x.tag for x in zh}
          assert (root/'1.5/Assemblies/FightFiresWithWater.dll').exists()
          PY
          rm -rf release
          mkdir -p 'release/Fight Fires With Water 1.5 Backport'
          cp -a FFWW-1.5/About FFWW-1.5/Languages FFWW-1.5/1.5 'release/Fight Fires With Water 1.5 Backport/'
          sha256sum FFWW-1.5/1.5/Assemblies/FightFiresWithWater.dll
      - uses: actions/upload-artifact@v4
        with:
          name: Fight-Fires-With-Water-1.5.4063-Backport-MO-DBHMedieval-V1.0
          path: release/
