name: Fetch FFWW
on:
  push:
    branches: [fight-fires-water-15-backport]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-water-15-backport
      - name: Install SteamCMD
        run: |
          mkdir -p "$GITHUB_WORKSPACE/steamcmd"
          curl -L --retry 3 -o /tmp/steamcmd_linux.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf /tmp/steamcmd_linux.tar.gz -C "$GITHUB_WORKSPACE/steamcmd"
      - name: Download Workshop item
        run: |
          "$GITHUB_WORKSPACE/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 294100 3631692625 validate +quit
          SRC="$GITHUB_WORKSPACE/steamcmd/steamapps/workshop/content/294100/3631692625"
          find "$SRC" -maxdepth 5 -type f -print
          cp -a "$SRC" "$GITHUB_WORKSPACE/FFWW-original"
      - name: Upload original
        uses: actions/upload-artifact@v4
        with:
          name: FFWW-original
          path: FFWW-original
