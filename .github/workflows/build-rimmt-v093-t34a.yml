name: Build RimMT V0.9.3-T34A Async Candidate Fabric

on:
  push:
    branches:
      - rimmt-v0.9.3-t34a-async-candidate-fabric
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t34a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T34-A
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT34A.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T34A-Async-Candidate-Fabric
          path: |
            build/RimMT_V0.9.3_T34A_AsyncCandidateFabric.zip
            build/RimMT_Diagnostics_v0.17_T34A.zip
            build/RimMT_T34A_AsyncCandidateFabric_Bundle.zip
          if-no-files-found: error
