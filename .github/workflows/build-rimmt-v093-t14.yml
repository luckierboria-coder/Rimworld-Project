name: Build RimMT V0.9.3-T14 PlayerHuman Residual Attribution

on:
  push:
    branches: [ rimmt-v0.9.3-t14-playerhuman-residual-attribution ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t14.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply V22 Stable transforms
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanTransforms.ps1

      - name: Apply V23 S4 pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV23S4Pruners.ps1

      - name: Apply V24 S4 telemetry and pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV24S4TelemetryAndPruners.ps1

      - name: Apply V26 Consolidated Stable marker
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV26Consolidated.ps1

      - name: Apply T0 Tail Observatory
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T0TailObservatory.ps1

      - name: Apply T1 Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1TailAttribution.ps1

      - name: Apply T1A no-global-fuse policy
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1ANoGlobalFuse.ps1

      - name: Apply T2 Pawn Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T2PawnTailAttribution.ps1

      - name: Apply T3 bounded FindPath layer
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T3HeavyWorkGiverEarlyRescue.ps1

      - name: Apply T4 HaulMerge partner index and revert T3 early rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T4HaulMergePartnerIndex.ps1

      - name: Apply T5 measurement-only HaulMerge Harmony census
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T5HaulMergePatchCensus.ps1

      - name: Apply T8 clean T5 carrier/mech cheap negatives
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T8T5CarrierPruners.ps1

      - name: Apply T13 PawnTick aggregate attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T13PawnTickAggregateAttribution.ps1

      - name: Apply T14 PlayerHuman residual attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T14PlayerHumanResidualAttribution.ps1

      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify T14 clean lineage and bounded diagnostic policy
        shell: pwsh
        run: |
          $bootstrap = Get-Content 'RimMT/Source/RimMT/Bootstrap/RimMTBootstrap.cs' -Raw
          if ($bootstrap -notmatch '0\.9\.3-t14-playerhuman-residual-attribution') { throw 'Bootstrap is not V0.9.3-T14.' }
          if ($bootstrap -notmatch 'PlayerHumanResidualPatches093T14\.Apply\(harmony\)') { throw 'T14 Pawn.Tick transpiler is not installed.' }
          if ($bootstrap -match 'PatherInternalPatches093T9|TryEnterForeignPatches093T10|GenerateNewPathForeignPatches093T11|TryEnterCleanPatches093T12') { throw 'Old heavy diagnostic chain leaked into T14.' }

          $reach = Get-Content 'RimMT/Source/RimMT/AI/AggressiveReachabilityProfilesV17.cs' -Raw
          if ($reach -notmatch 'V0\.4\.18-T1A' -or $reach -notmatch 'globalFuse=OFF') { throw 'No-global-fuse policy missing.' }
          if ($reach -match 'UpdateRollingFuseMode\(\);') { throw 'Global fuse gate is active.' }

          $s4 = Get-Content 'RimMT/Source/RimMT/AI/JobGiverSlowSearch0419S.cs' -Raw
          if ($s4 -match 'earlyKnownCustomAdmissions\+\+' -or $s4 -match 'earlyKnownListAdmissions\+\+') { throw 'T3 8ms early rescue is active.' }
          if ($s4 -notmatch 'earlyKnownPolicy=OFF') { throw 'Early rescue OFF marker missing.' }
          if ($s4 -notmatch 'CarrierMechCheapNegative093T8\.TryPrepare\(resolvedScanner') { throw 'T8 carrier/mech pruners missing.' }

          $merge = Get-Content 'RimMT/Source/RimMT/AI/WorkGiverMergePartnerIndex093T4.cs' -Raw
          if ($merge -match 'HasForeignPostfixExceptAcceptedCommonSense' -or $merge -match 'commonSenseMonotonicPostfixAccepted') { throw 'T6 Common Sense HaulMerge coexistence leaked into T14.' }
          if ($merge -notmatch 'return HasForeign\(info\.Prefixes\) \|\| HasForeign\(info\.Postfixes\)') { throw 'T5 strict T4 foreign blocker changed.' }

          $t13 = Get-Content 'RimMT/Source/RimMT/Diagnostics/PawnTickAggregateAttribution093T13.cs' -Raw
          if ($t13 -match 'Stopwatch\.GetTimestamp|new\s+Stopwatch|harmony\.Patch\(') { throw 'T13 low-overhead aggregate attribution was changed.' }

          $t14 = Get-Content 'RimMT/Source/RimMT/Diagnostics/PlayerHumanResidualAttribution093T14.cs' -Raw
          $t14Patch = Get-Content 'RimMT/Source/RimMT/Patches/PlayerHumanResidualPatches093T14.cs' -Raw
          if ($t14 -notmatch 'SampleMask = 255') { throw 'T14 is not thinned to 1/256 periodic samples.' }
          if ($t14 -notmatch 'pawn\.Faction == null \|\| !pawn\.Faction\.IsPlayer') { throw 'T14 is not Player faction bounded.' }
          if ($t14 -notmatch '!pawn\.def\.race\.Humanlike') { throw 'T14 is not Humanlike bounded.' }
          if ($t14Patch -notmatch 'typeof\(Pawn\), "Tick"') { throw 'T14 target is not Pawn.Tick.' }
          if ($t14Patch -notmatch 'HarmonyMethod transpiler' -or $t14Patch -match 'prefix:' -or $t14Patch -match 'postfix:') { throw 'T14 must install only one Pawn.Tick transpiler and no new method prefix/postfix probes.' }
          if ($t14Patch -notmatch 'Pawn_JobTracker' -or $t14Patch -notmatch 'Pawn_PathFollower') { throw 'T14 Job/Pather exclusions missing.' }
          if ($t14Patch -notmatch 'MaxProbeSites = 18') { throw 'T14 bounded probe-site cap missing.' }

          $t2Diag = Get-Content 'RimMT/Source/RimMT/Diagnostics/TailPawnAttribution093T2.cs' -Raw
          $t2Patch = Get-Content 'RimMT/Source/RimMT/Patches/TailPawnPatches093T2.cs' -Raw
          if ($t2Diag -notmatch 'PlayerHumanResidualAttribution093T14\.RecordPhase\(phase, us\)') { throw 'T14 does not reuse T2 phase timings.' }
          if ($t2Diag -notmatch 'PlayerHumanResidualAttribution093T14\.RecordPawn\(pawn, us\)') { throw 'T14 does not consume T2 Pawn timing.' }
          if ($t2Patch -notmatch 'PlayerHumanResidualAttribution093T14\.BeginPawn\(__instance, deep, __state\)') { throw 'T14 is not bound to the exact T2 Pawn start timestamp.' }

          $diag = Get-Content 'RimMT/Source/RimMT/Diagnostics/RimMTDiagnostics.cs' -Raw
          if ($diag -notmatch 'V0\.9\.3-T14 PlayerHuman Residual Attribution') { throw 'T14 report title missing.' }
          foreach ($marker in @('PlayerHumanResidualAttribution093T14.Summary','PlayerHumanResidualAttribution093T14.StageSummary','PlayerHumanResidualAttribution093T14.ProbeSummary','PlayerHumanResidualAttribution093T14.RecentSummary')) {
            if ($diag -notmatch [regex]::Escape($marker)) { throw "T14 report marker missing: $marker" }
          }

          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') { throw "Unexpected DLL set: $($packDlls.Name -join ', ')" }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.9.3_T14_PlayerHuman_Residual_Attribution.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T14-PlayerHuman-Residual-Attribution
          path: build/RimMT_V0.9.3_T14_PlayerHuman_Residual_Attribution.zip
          if-no-files-found: error
