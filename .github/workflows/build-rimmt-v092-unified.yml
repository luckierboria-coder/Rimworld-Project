name: Build RimMT V0.10.0 Lean MT Rebase

on:
  push:
    branches: [ rimmt-v0.10.0-lean-mt-rebase ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v092-unified.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # V0.10 is intentionally source-of-truth only. Do not re-apply the V0.9.4-V0.9.12
      # continuation/predictive transform chain here: those transforms are the route we are
      # retiring after long-run testing showed high main-thread bookkeeping and almost idle workers.
      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify single DLL
        shell: pwsh
        run: |
          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') {
            throw "Package contains unexpected DLL set: $($packDlls.Name -join ', ')"
          }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.10.0_Lean_MT_Rebase.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.10.0-Lean-MT-Rebase
          path: build/RimMT_V0.10.0_Lean_MT_Rebase.zip
          if-no-files-found: error
