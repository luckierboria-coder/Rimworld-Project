name: Build RimMT V0.9.3-T4 HaulMerge Partner Index

on:
  push:
    branches: [ rimmt-v0.9.3-t4-haulmerge-partner-index ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v092-unified.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply V22 Stable transforms
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanTransforms.ps1

      - name: Apply V23 S4 pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV23S4Pruners.ps1

      - name: Apply V24 S4 telemetry and pruners
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV24S4TelemetryAndPruners.ps1

      - name: Apply V26 Consolidated Stable marker
        shell: pwsh
        run: ./RimMT/Build/ApplyUnifiedLeanV26Consolidated.ps1

      - name: Apply T0 Tail Observatory
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T0TailObservatory.ps1

      - name: Apply T1 Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1TailAttribution.ps1

      - name: Apply T1A no-global-fuse policy
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T1ANoGlobalFuse.ps1

      - name: Apply T2 Pawn Tail Attribution
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T2PawnTailAttribution.ps1

      - name: Apply T3 bounded FindPath + experimental early rescue layer
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T3HeavyWorkGiverEarlyRescue.ps1

      - name: Apply T4 HaulMerge partner index and revert T3 early rescue
        shell: pwsh
        run: ./RimMT/Build/ApplyRimMTV093T4HaulMergePartnerIndex.ps1

      - name: Restore
        run: dotnet restore RimMT/Source/RimMT/RimMT.csproj

      - name: Build Release
        run: dotnet build RimMT/Source/RimMT/RimMT.csproj --configuration Release --no-restore

      - name: Verify T4 version, HaulMerge index, no early rescue, no global fuse and single DLL
        shell: pwsh
        run: |
          $bootstrap = Get-Content 'RimMT/Source/RimMT/Bootstrap/RimMTBootstrap.cs' -Raw
          if ($bootstrap -notmatch '0\.9\.3-t4-haulmerge-partner-index') { throw 'Bootstrap is not V0.9.3-T4.' }
          if ($bootstrap -notmatch 'TailAttributionPatches093T1\.Apply') { throw 'T1 top-level attribution patches are not installed.' }
          if ($bootstrap -notmatch 'TailPawnPatches093T2\.Apply') { throw 'T2 pawn attribution patches are not installed.' }
          if ($bootstrap -notmatch 'TailPathfinderPatches093T3\.Apply') { throw 'T3 bounded PathFinder attribution is not installed.' }
          if ($bootstrap -notmatch 'WorkGiverMergePartnerIndex093T4\.Apply') { throw 'T4 HaulMerge partner index is not installed.' }

          $reach = Get-Content 'RimMT/Source/RimMT/AI/AggressiveReachabilityProfilesV17.cs' -Raw
          if ($reach -notmatch 'V0\.4\.18-T1A') { throw 'ReachProfile T1A no-global-fuse transform was not applied.' }
          if ($reach -match 'UpdateRollingFuseMode\(\);') { throw 'Global fuse gate is still called from ReachProfile prefix.' }
          if ($reach -match 'ObserveRollingSample\(true, __state\.Slot\);') { throw 'Mismatch still feeds global fuse state.' }
          if ($reach -notmatch 'globalFuse=OFF') { throw 'No-global-fuse policy marker missing.' }

          $s4 = Get-Content 'RimMT/Source/RimMT/AI/JobGiverSlowSearch0419S.cs' -Raw
          if ($s4 -match 'earlyKnownCustomAdmissions\+\+') { throw 'T3 custom 8ms early admission is still active.' }
          if ($s4 -match 'earlyKnownListAdmissions\+\+') { throw 'T3 list 8ms early admission is still active.' }
          if ($s4 -notmatch 'earlyKnownPolicy=OFF') { throw 'T4 early-rescue-off marker is missing.' }
          if ($s4 -notmatch 'targetedFeedHemogenRejected' -or $s4 -notmatch 'targetedVisitSickRejected') { throw 'V24 stable S4 pruners are missing.' }

          $merge = Get-Content 'RimMT/Source/RimMT/AI/WorkGiverMergePartnerIndex093T4.cs' -Raw
          if ($merge -notmatch 'class WorkGiverMergePartnerIndex093T4') { throw 'T4 HaulMerge source is missing.' }
          if ($merge -notmatch 'Cache lifetime=one synchronous JobGiver_Work package') { throw 'T4 package-local cache policy marker is missing.' }
          if ($merge -notmatch 'UsesSupportedVanillaStackSemantics') { throw 'T4 stack-semantics fail-open guard is missing.' }
          if ($merge -notmatch 'HasForeignPatch') { throw 'T4 foreign-Harmony authority guard is missing.' }
          if ($merge -notmatch 'HasPartnerFor') { throw 'T4 necessary-condition proof is missing.' }

          $diag = Get-Content 'RimMT/Source/RimMT/Diagnostics/RimMTDiagnostics.cs' -Raw
          if ($diag -notmatch 'V0\.9\.3-T4 HaulMerge Partner Index') { throw 'T4 report marker was not applied.' }
          if ($diag -notmatch 'WorkGiverMergePartnerIndex093T4\.Summary') { throw 'T4 report line is missing.' }
          if ($diag -notmatch 'S4 early rescue=OFF') { throw 'T4 production policy does not state early rescue is OFF.' }

          $pawn = Get-Content 'RimMT/Source/RimMT/Diagnostics/TailPawnAttribution093T2.cs' -Raw
          if ($pawn -notmatch 'TailPathfinderAttribution093T3\.BeginTick' -or $pawn -notmatch 'TailPathfinderAttribution093T3\.EndTick') { throw 'T2/T3 deep-window lifecycle integration is missing.' }
          $pathDiag = Get-Content 'RimMT/Source/RimMT/Diagnostics/TailPathfinderAttribution093T3.cs' -Raw
          if ($pathDiag -notmatch 'T3 PathFinder deep attribution') { throw 'T3 bounded PathFinder attribution source is missing.' }

          $dir = 'RimMT/1.5/Assemblies'
          $dll = Join-Path $dir 'RimMT.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          $all = @(Get-ChildItem $dir -Filter '*.dll' -File)
          if ($all.Count -ne 1) { throw "Production build must contain exactly one DLL; found $($all.Count): $($all.Name -join ', ')" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build/RimMT'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'RimMT/About' $stage -Recurse
          Copy-Item 'RimMT/Languages' $stage -Recurse
          Copy-Item 'RimMT/1.5' $stage -Recurse
          Copy-Item 'RimMT/LoadFolders.xml' $stage
          if (Test-Path 'RimMT/README.md') { Copy-Item 'RimMT/README.md' $stage }
          $packDlls = @(Get-ChildItem $stage -Filter '*.dll' -File -Recurse)
          if ($packDlls.Count -ne 1 -or $packDlls[0].Name -ne 'RimMT.dll') {
            throw "Package contains unexpected DLL set: $($packDlls.Name -join ', ')"
          }
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.9.3_T4_HaulMerge_Partner_Index.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T4-HaulMerge-Partner-Index
          path: build/RimMT_V0.9.3_T4_HaulMerge_Partner_Index.zip
          if-no-files-found: error
