# RimWorld 1.5.4063 / Unity 2019.4.30f1 backport CI
name: SMF 1.5 Backport

on:
  push:
    branches: [smf-1.5-backport]
    paths:
      - '.github/workflows/smf15-backport.yml'
      - 'SMF15/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_PROCESS_COUNT: 2

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout SimplyMoreFPS 0.3.12
        shell: pwsh
        run: git clone --depth 1 --branch v0.3.12 https://github.com/olligod/SimplyMoreFPS.git upstream

      - name: Apply RimWorld 1.5.4063 managed API backport
        shell: pwsh
        run: |
          $p = 'upstream/RimWorldRefs.props'
          $s = Get-Content $p -Raw
          $s = $s.Replace('Version="1.6.4871"', 'Version="1.5.4063"')
          $s = $s.Replace('    <DoNotPublicize Include="Assembly-CSharp:RimWorld.Planet.WorldGrid.OnPlanetLayerAdded" />' + [Environment]::NewLine, '')
          $s = $s.Replace('    <DoNotPublicize Include="Assembly-CSharp:RimWorld.Planet.WorldGrid.OnPlanetLayerRemoved" />' + [Environment]::NewLine, '')
          Set-Content $p $s -Encoding UTF8
          $about = 'upstream/About/About.xml'
          $a = Get-Content $about -Raw
          $a = $a.Replace('<modVersion>0.3.12</modVersion>', '<modVersion>0.3.12-rw15-alpha5</modVersion>')
          $a = $a.Replace('<li>1.6</li>', '<li>1.5</li>')
          Set-Content $about $a -Encoding UTF8
          & 'SMF15/patch.ps1' -Root (Resolve-Path 'upstream')
          & 'SMF15/patch-alpha4.ps1' -Root (Resolve-Path 'upstream')
          & 'SMF15/patch-alpha5.ps1' -Root (Resolve-Path 'upstream')

      - name: Generate Unity 2019.4.30f1 Shader and AssetBundle schemas
        shell: pwsh
        run: |
          python -m pip install pycryptodome
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/AssetRipper/TypeTreeDumps/main/InfoJson/2019.4.30f1.json' -OutFile 'unity2019-info.json'
          python SMF15/gen_unity2019_schemas.py --input unity2019-info.json --shader-out upstream/src/Smf.Mod/Rendering/Shaders/class-48.json --bundle-out upstream/src/Smf.Mod/Rendering/Shaders/class-142.json --info-out unity2019-schema-info.txt
          Get-Content unity2019-schema-info.txt

      - name: Apply Unity 2019 serialized shader backport
        shell: pwsh
        run: |
          & 'SMF15/patch-shader2019.ps1' -Root (Resolve-Path 'upstream')
          & 'SMF15/patch-shader2019-alpha3.ps1' -Root (Resolve-Path 'upstream')

      - name: Verify alpha5 source profile
        shell: pwsh
        run: |
          $shader = Get-Content 'upstream/src/Smf.Mod/Rendering/Shaders/GuiShaderBundleAssembler.cs' -Raw
          foreach ($marker in @('2019.4.30f1','SerializedVersion = 21','BundleVersion = 6','ED2A06CE7FB8203F6EFB5AB5E0CE20D5','ResolveRequests','Field(value, "m_ParsedForm/m_Name").AsString')) { if ($shader -notmatch [regex]::Escape($marker)) { throw "Missing alpha5 shader marker: $marker" } }
          if ($shader -match 'string name = Field\(value, "m_Name"\)\.AsString') { throw 'Alpha2 root m_Name resolver leaked into alpha5.' }
          if ($shader -match 'Version = 22' -or $shader -match 'bundle.Header.Version == 8') { throw 'Unity 2022 container generation leaked into alpha5.' }

          $coverage = Get-Content 'upstream/src/Smf.Mod/Rendering/MapCoverageCapture.cs' -Raw
          foreach ($marker in @('MapComponentUpdate','RequireTarget(typeof(Root_Play), "Update")','RequireTarget(typeof(Map), "MapUpdate")','MapMeshDrawerUpdate_First','FleckManagerDraw')) { if ($coverage -notmatch [regex]::Escape($marker)) { throw "Missing alpha5 coverage marker: $marker" } }
          if ($coverage -match 'MapComponentOnDraw') { throw '1.6 MapComponentOnDraw leaked into alpha5.' }

          $gui = Get-Content 'upstream/src/Smf.Mod/Rendering/GuiRasterCapture.cs' -Raw
          foreach ($marker in @('RenderTexture topLevelTarget = RenderTexture.active','topLevelTarget != Capture.Hud','Top-level Repaint entered a leaked SMF capture target.','Capture start bypassed the top-level render-target ownership guard.')) { if ($gui -notmatch [regex]::Escape($marker)) { throw "Missing alpha5 GUI target marker: $marker" } }
          if ($gui -match [regex]::Escape('First top-level Repaint does not target the original client framebuffer.')) { throw 'Alpha4 fatal foreign-framebuffer assertion leaked into alpha5.' }

          $s48 = Get-Content 'upstream/src/Smf.Mod/Rendering/Shaders/class-48.json' -Raw
          if ($s48 -notmatch '2019\.4\.30f1' -or $s48 -notmatch '"SerializedVersion":21') { throw '2019 Shader schema was not installed.' }

      - name: Compile managed solution against RimWorld 1.5.4063
        working-directory: upstream
        shell: pwsh
        run: dotnet build SimplyMoreFPS.sln -c Release -m:1 -p:UseRimWorldReferenceAssemblies=true

      - name: Print dynamic AccessTools sites for review
        shell: pwsh
        run: Get-ChildItem upstream/src/Smf.Mod -Recurse -Filter *.cs | Select-String -Pattern 'AccessTools\.(Method|Field|Property|Constructor)' | ForEach-Object { $_.Path + ':' + $_.LineNumber + ' ' + $_.Line.Trim() }

      - name: Audit complete startup-path APIs against exact RimWorld 1.5.4063 metadata
        shell: pwsh
        run: |
          $refDir = Join-Path $env:USERPROFILE '.nuget\packages\krafs.rimworld.ref\1.5.4063\ref\net472'
          if (!(Test-Path $refDir)) { throw "RimWorld 1.5 ref directory missing: $refDir" }
          dotnet run --project SMF15/ApiAudit/ApiAudit.csproj -- $refDir

      - name: Run managed tests
        working-directory: upstream
        shell: pwsh
        run: dotnet run --project tests/Smf.Tests -c Release --no-build

      - name: Build native renderer
        working-directory: upstream
        shell: pwsh
        run: python tools/build-renderer-windows.py --output build --tests

      - name: Stage 1.5 mod
        working-directory: upstream
        shell: pwsh
        run: python tools/build.py --reference-assemblies --runtime win-x64 --native-directory build --output staging/SimplyMoreFPS

      - name: Re-apply 1.5 alpha5 metadata after staging
        shell: pwsh
        run: |
          $about = 'upstream/staging/SimplyMoreFPS/About/About.xml'
          $a = Get-Content $about -Raw
          $a = $a.Replace('<modVersion>0.3.12</modVersion>', '<modVersion>0.3.12-rw15-alpha5</modVersion>')
          $a = $a.Replace('<li>1.6</li>', '<li>1.5</li>')
          Set-Content $about $a -Encoding UTF8
          @'
          SimplyMoreFPS 0.3.12 RimWorld 1.5.4063 backport alpha5

          Alpha5 is gated by exact 1.5.4063 startup-path API and staged-IL audits.
          - Unity 2019.4.30f1 / SerializedFile v21 / UnityFS v6.
          - Built-in shader identity from m_ParsedForm/m_Name.
          - RimWorld 1.6 MapComponentOnDraw scope mapped to RimWorld 1.5 MapComponentUpdate(Map).
          - Coverage targets are preflighted before patch installation.
          - Camera, GUI capture, selection overlay and TPS Boost dynamic targets are checked against 1.5.4063 reference metadata.
          - Foreign/custom top-level IMGUI RenderTextures are left to their owner instead of killing or hijacking the detached renderer.
          - The current source frame is omitted from detached capture and the next frame retries normally.
          - SMF's own leaked HUD/world capture targets still fail closed.

          This is an unofficial backport. Upstream SimplyMoreFPS remains targeted at RimWorld 1.6.
          '@ | Set-Content 'upstream/staging/SimplyMoreFPS/BACKPORT-NOTES.txt' -Encoding UTF8

      - name: Audit staged Smf.Mod IL
        shell: pwsh
        run: |
          $refDir = Join-Path $env:USERPROFILE '.nuget\packages\krafs.rimworld.ref\1.5.4063\ref\net472'
          $dll = 'upstream/staging/SimplyMoreFPS/Assemblies/Smf.Mod.dll'
          if (!(Test-Path $dll)) { throw 'Smf.Mod.dll missing from stage.' }
          dotnet run --project SMF15/ApiAudit/ApiAudit.csproj -- $refDir $dll

      - name: Package Windows ZIP
        working-directory: upstream
        shell: pwsh
        run: python tools/package-release.py --mod staging/SimplyMoreFPS --runtimes win-x64 --output packages

      - uses: actions/upload-artifact@v4
        with:
          name: SimplyMoreFPS-0.3.12-rw15-alpha5-win-x64
          path: upstream/packages/*.zip
          if-no-files-found: error
