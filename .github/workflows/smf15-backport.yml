# RimWorld 1.5.4063 / Unity 2019.4.30f1 backport CI
name: SMF 1.5 Backport

on:
  push:
    branches: [smf-1.5-backport]
    paths:
      - '.github/workflows/smf15-backport.yml'
      - 'SMF15/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_PROCESSOR_COUNT: 2

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout SimplyMoreFPS 0.3.12
        shell: pwsh
        run: git clone --depth 1 --branch v0.3.12 https://github.com/olligod/SimplyMoreFPS.git upstream

      - name: Apply RimWorld 1.5.4063 managed API backport
        shell: pwsh
        run: |
          $p = 'upstream/RimWorldRefs.props'
          $s = Get-Content $p -Raw
          $s = $s.Replace('Version="1.6.4871"', 'Version="1.5.4063"')
          $s = $s.Replace('    <DoNotPublicize Include="Assembly-CSharp:RimWorld.Planet.WorldGrid.OnPlanetLayerAdded" />' + [Environment]::NewLine, '')
          $s = $s.Replace('    <DoNotPublicize Include="Assembly-CSharp:RimWorld.Planet.WorldGrid.OnPlanetLayerRemoved" />' + [Environment]::NewLine, '')
          Set-Content $p $s -Encoding UTF8

          $about = 'upstream/About/About.xml'
          $a = Get-Content $about -Raw
          $a = $a.Replace('<modVersion>0.3.12</modVersion>', '<modVersion>0.3.12-rw15-alpha2</modVersion>')
          $a = $a.Replace('<li>1.6</li>', '<li>1.5</li>')
          Set-Content $about $a -Encoding UTF8

          & 'SMF15/patch.ps1' -Root (Resolve-Path 'upstream')

      - name: Generate Unity 2019.4.30f1 Shader and AssetBundle schemas
        shell: pwsh
        run: |
          python -m pip install pycryptodome
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/AssetRipper/TypeTreeDumps/main/InfoJson/2019.4.30f1.json' -OutFile 'unity2019-info.json'
          python SMF15/gen_unity2019_schemas.py `
            --input unity2019-info.json `
            --shader-out upstream/src/Smf.Mod/Rendering/Shaders/class-48.json `
            --bundle-out upstream/src/Smf.Mod/Rendering/Shaders/class-142.json `
            --info-out unity2019-schema-info.txt
          Get-Content unity2019-schema-info.txt

      - name: Apply Unity 2019 serialized shader backport
        shell: pwsh
        run: '& ''SMF15/patch-shader2019.ps1'' -Root (Resolve-Path ''upstream'')'

      - name: Verify alpha2 source profile
        shell: pwsh
        run: |
          $p = Get-Content 'upstream/src/Smf.Mod/Rendering/Shaders/GuiShaderBundleAssembler.cs' -Raw
          foreach ($marker in @('2019.4.30f1','SerializedVersion = 21','BundleVersion = 6','ED2A06CE7FB8203F6EFB5AB5E0CE20D5','ResolveRequests')) {
            if ($p -notmatch [regex]::Escape($marker)) { throw "Missing alpha2 shader marker: $marker" }
          }
          if ($p -match 'Version = 22' -or $p -match 'bundle.Header.Version == 8') { throw 'Unity 2022 container generation leaked into alpha2.' }
          $s48 = Get-Content 'upstream/src/Smf.Mod/Rendering/Shaders/class-48.json' -Raw
          if ($s48 -notmatch '2019\.4\.30f1' -or $s48 -notmatch '"SerializedVersion":21') { throw '2019 Shader schema was not installed.' }

      - name: Compile managed solution against RimWorld 1.5.4063
        working-directory: upstream
        shell: pwsh
        run: dotnet build SimplyMoreFPS.sln -c Release -m:1 -p:UseRimWorldReferenceAssemblies=true

      - name: Run managed tests
        working-directory: upstream
        shell: pwsh
        run: dotnet run --project tests/Smf.Tests -c Release --no-build

      - name: Build native renderer
        working-directory: upstream
        shell: pwsh
        run: python tools/build-renderer-windows.py --output build --tests

      - name: Stage 1.5 mod
        working-directory: upstream
        shell: pwsh
        run: python tools/build.py --reference-assemblies --runtime win-x64 --native-directory build --output staging/SimplyMoreFPS

      - name: Re-apply 1.5 alpha2 metadata after staging
        shell: pwsh
        run: |
          $about = 'upstream/staging/SimplyMoreFPS/About/About.xml'
          $a = Get-Content $about -Raw
          $a = $a.Replace('<modVersion>0.3.12</modVersion>', '<modVersion>0.3.12-rw15-alpha2</modVersion>')
          $a = $a.Replace('<li>1.6</li>', '<li>1.5</li>')
          Set-Content $about $a -Encoding UTF8
          @'
SimplyMoreFPS 0.3.12 RimWorld 1.5.4063 backport alpha2

Alpha2 fixes the GUI shader initialization failure from alpha1:
- Unity profile changed from 2022.3.35f1 / SerializedFile v22 to RimWorld 1.5's Unity 2019.4.30f1 / v21.
- Shader (class 48) and AssetBundle (class 142) release type trees are generated from AssetRipper TypeTreeDumps for 2019.4.30f1.
- UnityFS output is v6 for the Unity 2019 runtime.
- Required built-in GUI shaders are resolved by serialized m_Name rather than Unity 2022 path IDs.
- Shader object edits remain limited to names and blend-state fields; source bytes are still roundtrip validated before derived bundle creation.

This is an unofficial backport. Upstream SimplyMoreFPS remains targeted at RimWorld 1.6.
'@ | Set-Content 'upstream/staging/SimplyMoreFPS/BACKPORT-NOTES.txt' -Encoding UTF8

      - name: Verify staged assembly embeds Unity 2019 profile
        shell: pwsh
        run: |
          $dll = 'upstream/staging/SimplyMoreFPS/Assemblies/Smf.Mod.dll'
          if (!(Test-Path $dll)) { throw 'Smf.Mod.dll missing from stage.' }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $ascii = [Text.Encoding]::UTF8.GetString($bytes)
          if ($ascii -notmatch '2019\.4\.30f1') { throw 'Staged Smf.Mod.dll does not contain Unity 2019 profile.' }

      - name: Package Windows ZIP
        working-directory: upstream
        shell: pwsh
        run: python tools/package-release.py --mod staging/SimplyMoreFPS --runtimes win-x64 --output packages

      - uses: actions/upload-artifact@v4
        with:
          name: SimplyMoreFPS-0.3.12-rw15-alpha2-win-x64
          path: upstream/packages/*.zip
          if-no-files-found: error
