name: Build RimMT V0.9.3-T28 Unified Job Search Transaction

on:
  push:
    branches:
      - rimmt-v0.9.3-t28-unified-job-search-transaction
  pull_request:
    branches:
      - rimmt-v0.9.3-t27.8-job-search-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t28-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T28
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT28.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T28-Unified-Job-Search-Transaction
          path: |
            build/RimMT_V0.9.3_T28_Production.zip
            build/RimMT_Diagnostics_v0.6.zip
            build/RimMT_T28_With_Diagnostics_Bundle.zip
          if-no-files-found: error
