name: Build RimMT V0.9.3-T34B Scanner Parallel Fabric

on:
  push:
    branches:
      - rimmt-v0.9.3-t34b-scanner-parallel-fabric
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t34b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T34-B
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT34B.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T34B-Scanner-Parallel-Fabric
          path: |
            build/RimMT_V0.9.3_T34B_ScannerParallelFabric.zip
            build/RimMT_Diagnostics_v0.18_T34B.zip
            build/RimMT_T34B_ScannerParallelFabric_Bundle.zip
          if-no-files-found: error
