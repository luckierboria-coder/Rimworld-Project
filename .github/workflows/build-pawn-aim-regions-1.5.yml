name: Build Pawn Aim Regions 1.5

on:
  push:
    branches: [ main ]
    paths:
      - 'Pawn-Aim-Regions-1.5/**'
      - '.github/workflows/build-pawn-aim-regions-1.5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Pawn-Aim-Regions-1.5/Source/PawnAimRegions15.csproj
      - name: Build Release
        run: dotnet build Pawn-Aim-Regions-1.5/Source/PawnAimRegions15.csproj --configuration Release --no-restore
      - name: Verify and package
        shell: pwsh
        run: |
          $dll = 'Pawn-Aim-Regions-1.5\1.5\Assemblies\PawnAimRegions15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL missing.' }
          Remove-Item 'dist' -Recurse -Force -ErrorAction SilentlyContinue
          $stage = 'dist\Pawn-Aim-Regions-1.5'
          New-Item -ItemType Directory -Force -Path "$stage\About" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Assemblies" | Out-Null
          Copy-Item 'Pawn-Aim-Regions-1.5\About\About.xml' "$stage\About\About.xml"
          Copy-Item $dll "$stage\1.5\Assemblies\PawnAimRegions15.dll"
          Copy-Item 'Pawn-Aim-Regions-1.5\1.5\Languages' "$stage\1.5\Languages" -Recurse
          Copy-Item 'Pawn-Aim-Regions-1.5\LoadFolders.xml' "$stage\LoadFolders.xml"
          Copy-Item 'Pawn-Aim-Regions-1.5\README_CN.txt' "$stage\README_CN.txt"
          $files = Get-ChildItem $stage -Recurse -File
          if ($files.Name -contains '0Harmony.dll') { throw 'Dependency DLL leaked into package.' }
          if ($files.Name -match '\.pdb$') { throw 'PDB leaked into package.' }
          Compress-Archive -Path $stage -DestinationPath 'dist\Pawn-Aim-Regions-1.5.zip' -Force
      - name: Upload mod zip
        uses: actions/upload-artifact@v4
        with:
          name: Pawn-Aim-Regions-1.5
          path: dist/Pawn-Aim-Regions-1.5.zip
          if-no-files-found: error
