name: Audit official WTL 1.1.6 release files
on:
  push:
    paths:
      - ".github/workflows/audit-wtl-116-release.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect public WTL 1.1.6 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, io, zipfile, hashlib
          url="https://api.github.com/repos/m00nl1ght-dev/WorldTechLevel/releases/tags/1.1.6"
          h={"User-Agent":"RimWorld-WTL-Audit","Authorization":"Bearer "+os.environ["GH_TOKEN"]}
          with urllib.request.urlopen(urllib.request.Request(url,headers=h)) as f: rel=json.load(f)
          print("Release", rel['tag_name'], "assets:",flush=True)
          for asset in rel["assets"]:
              print("ASSET",asset["name"],"size",asset["size"],"URL",asset["browser_download_url"],flush=True)
              if not asset["name"].lower().endswith(".zip"):continue
              try:
                  req=urllib.request.Request(asset["browser_download_url"],headers={"User-Agent":"RimWorld-WTL-Audit"})
                  with urllib.request.urlopen(req,timeout=45) as f: data=f.read()
                  print("DOWNLOADED",asset["name"],len(data),"sha256",hashlib.sha256(data).hexdigest(),flush=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      names=z.namelist()
                      for n in names:
                          if any(s in n for s in ["LunarLoader","LunarFramework","WorldTechLevel.dll","Manifest.xml","LoadFolders.xml","Version.txt"]):
                              print("  FILE",n, "size",z.getinfo(n).file_size,flush=True)
              except Exception as e:print("DOWNLOAD ERROR",asset["name"],type(e).__name__,str(e)[:300],flush=True)
          PY
