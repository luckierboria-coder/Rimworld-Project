name: Build BPC Area Restriction Safety 1.5

on:
  push:
    branches: [ main ]
    paths:
      - 'BPC-AreaRestriction-Safety-1.5/**'
      - '.github/workflows/build-bpc-area-restriction-safety-1.5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BPC-AreaRestriction-Safety-1.5/Source/BPCAreaRestrictionSafety15.csproj
      - name: Build Release
        run: dotnet build BPC-AreaRestriction-Safety-1.5/Source/BPCAreaRestrictionSafety15.csproj --configuration Release --no-restore
      - name: Verify and package
        shell: pwsh
        run: |
          $dll = 'BPC-AreaRestriction-Safety-1.5\1.5\Assemblies\BPCAreaRestrictionSafety15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($bad in @('StartJobAuthorityGate','ThinkTreeCommandGate','DcpBootstrap','DraftedCommandPriority','PlayerCommandGate')) {
            if ($ascii.Contains($bad)) { throw "Contaminated DLL: found $bad" }
          }
          if (!$ascii.Contains('BPCAreaRestrictionSafety15')) { throw 'Expected assembly marker missing.' }
          Remove-Item 'dist-bpc-area-safety' -Recurse -Force -ErrorAction SilentlyContinue
          $stage = 'dist-bpc-area-safety\BPC-AreaRestriction-Safety-1.5'
          New-Item -ItemType Directory -Force -Path "$stage\About" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Assemblies" | Out-Null
          Copy-Item 'BPC-AreaRestriction-Safety-1.5\About\About.xml' "$stage\About\About.xml"
          Copy-Item 'BPC-AreaRestriction-Safety-1.5\LoadFolders.xml' "$stage\LoadFolders.xml"
          Copy-Item $dll "$stage\1.5\Assemblies\BPCAreaRestrictionSafety15.dll"
          $files = Get-ChildItem $stage -Recurse -File
          if ($files.Name -contains '0Harmony.dll') { throw 'Dependency DLL leaked into package.' }
          if ($files.Name -match '\.pdb$') { throw 'PDB leaked into package.' }
          Compress-Archive -Path $stage -DestinationPath 'dist-bpc-area-safety\BPC-AreaRestriction-Safety-1.5.zip' -Force
      - name: Upload patch zip
        uses: actions/upload-artifact@v4
        with:
          name: BPC-AreaRestriction-Safety-1.5
          path: dist-bpc-area-safety/BPC-AreaRestriction-Safety-1.5.zip
          if-no-files-found: error
