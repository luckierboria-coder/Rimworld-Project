name: Build PUAH Hotfix 1.5 V5.2

on:
  push:
    branches:
      - feature/puah-v5.2-performance
    paths:
      - 'PUAH-1.5-Queue-Hotfix/**'
      - '.github/workflows/build-puah-hotfix.yml'
      - 'ci/PUAH_AssemblyCSharp_Stub.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mono and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel unzip curl zip

      - name: Download Harmony 2.0.4 build reference
        run: |
          rm -rf .ci-harmony
          mkdir -p .ci-harmony
          curl -fL 'https://www.nuget.org/api/v2/package/Lib.Harmony/2.0.4' -o .ci-harmony/harmony.nupkg
          unzip -q .ci-harmony/harmony.nupkg -d .ci-harmony/pkg
          HARMONY=$(find .ci-harmony/pkg -name 0Harmony.dll | head -n 1)
          test -n "$HARMONY"
          cp "$HARMONY" .ci-harmony/0Harmony.dll

      - name: Build Assembly-CSharp compile stub
        run: |
          mkdir -p .ci-refs
          mcs -sdk:4.5 -target:library -out:.ci-refs/Assembly-CSharp.dll ci/PUAH_AssemblyCSharp_Stub.cs

      - name: Compile V5.2
        run: |
          mkdir -p PUAH-1.5-Queue-Hotfix/1.5/Assemblies
          mcs -sdk:4.5 -langversion:5 -target:library -optimize+ \
            -out:PUAH-1.5-Queue-Hotfix/1.5/Assemblies/PUAHQueueHotfix.dll \
            -r:.ci-refs/Assembly-CSharp.dll \
            -r:.ci-harmony/0Harmony.dll \
            PUAH-1.5-Queue-Hotfix/Source/Hotfix.cs \
            PUAH-1.5-Queue-Hotfix/Source/Performance.cs

      - name: Verify binary markers
        run: |
          test -s PUAH-1.5-Queue-Hotfix/1.5/Assemblies/PUAHQueueHotfix.dll
          strings -el PUAH-1.5-Queue-Hotfix/1.5/Assemblies/PUAHQueueHotfix.dll | grep -F 'PUAH 1.5 Queue Hotfix V5.2'
          strings -el PUAH-1.5-Queue-Hotfix/1.5/Assemblies/PUAHQueueHotfix.dll | grep -F 'exact 16x16 spatial index'

      - name: Commit compiled DLL to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUAH-1.5-Queue-Hotfix/1.5/Assemblies/PUAHQueueHotfix.dll
          if ! git diff --cached --quiet; then
            git commit -m 'Build PUAH Hotfix V5.2 DLL [skip ci]'
            git push
          fi

      - name: Package installable mod
        run: |
          rm -rf dist
          mkdir -p dist/PUAH_1.5_QueueHotfix_V5.2
          cp -R PUAH-1.5-Queue-Hotfix/About dist/PUAH_1.5_QueueHotfix_V5.2/
          cp -R PUAH-1.5-Queue-Hotfix/1.5 dist/PUAH_1.5_QueueHotfix_V5.2/
          cp PUAH-1.5-Queue-Hotfix/README.txt dist/PUAH_1.5_QueueHotfix_V5.2/ || true
          cd dist
          zip -qr PUAH_1.5_QueueHotfix_V5.2.zip PUAH_1.5_QueueHotfix_V5.2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUAH-1.5-Queue-Hotfix-V5.2
          path: dist/PUAH_1.5_QueueHotfix_V5.2.zip
          if-no-files-found: error
