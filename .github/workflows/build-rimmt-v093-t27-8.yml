name: Build RimMT V0.9.3-T27.8 Job Search Foundation

on:
  push:
    branches:
      - rimmt-v0.9.3-t27.8-job-search-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t27-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T27.8
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT27_8.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T27.8-Job-Search-Foundation
          path: |
            build/RimMT_V0.9.3_T27.8_Production.zip
            build/RimMT_Diagnostics_v0.5.zip
            build/RimMT_T27.8_With_Diagnostics_Bundle.zip
          if-no-files-found: error
