name: Build GUCC RimWorld 1.5 Backport

on:
  push:
    branches: [ main ]
    paths:
      - 'GUCC-1.5-Backport/**'
      - '.github/workflows/build-gucc-1.5.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'GUCC-1.5-Backport/**'
      - '.github/workflows/build-gucc-1.5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SteamCMD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path steamcmd | Out-Null
          Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip -DestinationPath steamcmd -Force

      - name: Download GUCC workshop source
        shell: pwsh
        run: |
          & .\steamcmd\steamcmd.exe +login anonymous +workshop_download_item 294100 3778461890 validate +quit
          $steamExit = $LASTEXITCODE
          Write-Host "SteamCMD exit code: $steamExit (file presence is authoritative)"
          $global:LASTEXITCODE = 0
          $candidate = Join-Path (Resolve-Path steamcmd).Path 'steamapps\workshop\content\294100\3778461890'
          if (!(Test-Path $candidate)) {
            $hit = Get-ChildItem -Path . -Directory -Recurse -Filter 3778461890 | Select-Object -First 1
            if (!$hit) { throw 'SteamCMD did not download GUCC workshop item 3778461890.' }
            $candidate = $hit.FullName
          }
          New-Item -ItemType Directory -Force -Path 'GUCC-1.5-Backport\work' | Out-Null
          Copy-Item (Join-Path $candidate '*') 'GUCC-1.5-Backport\work' -Recurse -Force
          if (!(Test-Path 'GUCC-1.5-Backport\work\Source\GiddyUpCavalryCharge.csproj')) {
            throw 'Downloaded GUCC does not contain Source/GiddyUpCavalryCharge.csproj.'
          }

      - name: Apply RimWorld 1.5 backport
        shell: pwsh
        run: |
          ./GUCC-1.5-Backport/Apply_15_Backport.ps1 -ModRoot 'GUCC-1.5-Backport/work'
          ./GUCC-1.5-Backport/Fix_15_JobDriverAccess.ps1 -ModRoot 'GUCC-1.5-Backport/work'

      - name: Apply GUCC v0.9 cavalry organization patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'GUCC-1.5-Backport\V09PatchParts\part*.txt' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 GUCC v0.9 patch chunks, found $($parts.Count)." }
          $patch = Join-Path $env:RUNNER_TEMP 'gucc-v09.patch'
          [IO.File]::WriteAllText($patch, '')
          foreach ($part in $parts) {
            [IO.File]::AppendAllText($patch, [IO.File]::ReadAllText($part.FullName))
          }

          $sourceDir = 'GUCC-1.5-Backport/work/Source'
          & git apply --check --directory=$sourceDir $patch
          if ($LASTEXITCODE -ne 0) { throw 'GUCC v0.9 patch validation failed.' }
          & git apply --directory=$sourceDir $patch
          if ($LASTEXITCODE -ne 0) { throw 'GUCC v0.9 patch application failed.' }

          $requiredFiles = @(
            "$sourceDir/Core/Window_CavalryManager.cs",
            "$sourceDir/Core/CavalryUnitTemplateRecord.cs",
            "$sourceDir/Core/CavalryTemplatePairRecord.cs"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (!(Test-Path $requiredFile)) {
              throw "GUCC v0.9 patch did not create required source file: $requiredFile"
            }
          }

          $worldSource = Get-Content "$sourceDir/Core/ChargeWorldComponent.cs" -Raw
          foreach ($needle in @('GetUnitsSnapshot', 'SaveUnitAsTemplate', 'RestoreTemplate', 'NormalizeMultiUnitAfterLoad')) {
            if ($worldSource -notmatch [regex]::Escape($needle)) {
              throw "GUCC v0.9 patch missing required world-component method: $needle"
            }
          }
          $harmonySource = Get-Content "$sourceDir/Core/HarmonyPatches.cs" -Raw
          if ($harmonySource -notmatch 'new Window_CavalryManager') {
            throw 'GUCC v0.9 manager gizmo wiring is missing after patch application.'
          }
          Write-Host 'GUCC v0.9 source verification passed.'

      - name: Apply bilingual localization and v0.9 metadata
        shell: pwsh
        run: |
          $modRoot = 'GUCC-1.5-Backport\work'
          $locRoot = 'GUCC-1.5-Backport\Localization'

          foreach ($lang in @('English', 'ChineseSimplified')) {
            $source = Join-Path $locRoot $lang
            if (Test-Path $source) {
              $dest = Join-Path "$modRoot\Languages" $lang
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item (Join-Path $source '*') $dest -Recurse -Force
            }
          }

          $aboutPath = "$modRoot\About\About.xml"
          $about = Get-Content $aboutPath -Raw
          $about = $about.Replace('<modVersion>0.8.5-1.5-backport</modVersion>', '<modVersion>0.9-1.5-backport-bilingual</modVersion>')
          $description = '<description>Adds player-drawn solo and synchronized formation cavalry charges to Giddy-Up 2. The 0.9 1.5 backport adds multiple persistent cavalry units, per-unit commanders and target sizes, saved cavalry templates, and exact or auto-filled one-click reconstruction.' + [Environment]::NewLine + [Environment]::NewLine + '为 Giddy-Up 2 增加可由玩家绘制路线的单骑与编队冲锋。0.9 的 1.5 回移版新增多支持久骑兵队、独立指挥官和编制人数、骑兵编制模板，以及精确重组或自动补员的一键恢复。</description>'
          $about = [regex]::Replace($about, '(?s)<description>.*?</description>', $description)
          Set-Content $aboutPath $about -Encoding UTF8

          $sourceTextParts = @()
          foreach ($sourceFile in Get-ChildItem "$modRoot\Source\Core\*.cs" -File) {
            $sourceTextParts += Get-Content $sourceFile.FullName -Raw
          }
          $sourceText = $sourceTextParts -join [Environment]::NewLine
          $matches = [regex]::Matches($sourceText, '"(GUCC_[A-Za-z0-9_]+)"\.Translate')
          $keys = $matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique

          foreach ($lang in @('English', 'ChineseSimplified')) {
            $keyedFiles = Get-ChildItem "$modRoot\Languages\$lang\Keyed\*.xml" -File
            if (!$keyedFiles) { throw "No Keyed XML files found for $lang." }
            $combinedParts = @()
            foreach ($keyedFile in $keyedFiles) {
              $combinedParts += Get-Content $keyedFile.FullName -Raw
            }
            $combined = $combinedParts -join [Environment]::NewLine
            foreach ($key in $keys) {
              if ($combined -notmatch ('<' + [regex]::Escape($key) + '>')) {
                throw "Missing $lang localization key: $key"
              }
            }
            Write-Host "$lang localization coverage: $($keys.Count)/$($keys.Count)"
          }

      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GUCC-1.5-v0.9-Patched-Source
          path: GUCC-1.5-Backport/work/Source
          if-no-files-found: error

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GUCC-1.5-Backport/work/Source/GiddyUpCavalryCharge.csproj

      - name: Build Release
        run: dotnet build GUCC-1.5-Backport/work/Source/GiddyUpCavalryCharge.csproj --configuration Release --no-restore

      - name: Verify assembly
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'GUCC-1.5-Backport\work\1.5\Assemblies\GiddyUpCavalryCharge.dll' -File | Select-Object -First 1
          if (!$dll) { throw 'No compiled GUCC DLL found.' }
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($needle in @('Window_CavalryManager', 'CavalryUnitTemplateRecord', 'SaveUnitAsTemplate', 'RestoreTemplate')) {
            if (!$ascii.Contains($needle)) {
              throw "Compiled GUCC DLL is missing v0.9 symbol: $needle"
            }
          }
          $dll | Format-Table Name,Length,LastWriteTime
          Write-Host 'GUCC v0.9 assembly symbol verification passed.'

      - name: Package playtest build
        shell: pwsh
        run: |
          $src = 'GUCC-1.5-Backport\work'
          $stage = 'build\GUCC_1.5_Backport'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($dir in @('About','Defs','Sounds','Languages','1.5')) {
            if (Test-Path "$src\$dir") { Copy-Item "$src\$dir" $stage -Recurse -Force }
          }
          if (Test-Path "$src\README_1.5_BACKPORT.txt") { Copy-Item "$src\README_1.5_BACKPORT.txt" $stage }
          Compress-Archive -Path $stage -DestinationPath 'build\GUCC_1.5_Backport_v0.9.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUCC-1.5-Backport-v0.9
          path: build/GUCC_1.5_Backport_v0.9.zip
          if-no-files-found: error
