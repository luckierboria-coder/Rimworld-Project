name: Build RimMT V0.9.3-T27 Parallel Work Kernel

on:
  push:
    branches: [ rimmt-v0.9.3-t27-parallel-work-kernel ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t27.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t27-parallel-work-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T27
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT27.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T27-Parallel-Work-Kernel
          path: build/RimMT_V0.9.3_T27_Parallel_Work_Kernel.zip
          if-no-files-found: error
