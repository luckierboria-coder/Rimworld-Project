name: Build RimOPT 1.7 .NET 10 (pulse alpha)
on:
  push:
    branches: [rimopt-1.7-port]
    paths:
      - 'RimOPT/**'
      - '.github/workflows/build-rimopt-1.7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore RimOPT 1.7 references
        run: dotnet restore RimOPT/Source17/RimOPT.csproj
      - name: Build net10.0 mod DLL
        run: dotnet build RimOPT/Source17/RimOPT.csproj -c Release --no-restore
      - name: Stage test package
        run: |
          mkdir -p staging/RimOPT/1.7/Assemblies staging/RimOPT/About
          cp RimOPT/1.7/Assemblies/RimOPT.dll staging/RimOPT/1.7/Assemblies/
          cp RimOPT/About/About.xml staging/RimOPT/About/
          cp RimOPT/LoadFolders.xml staging/RimOPT/
          cp RimOPT/PORT-1.7-STATUS.md staging/RimOPT/
      - uses: actions/upload-artifact@v4
        with:
          name: RimOPT-1.7-0.4.0-alpha-WAYLITH
          path: staging/RimOPT
