name: Build RimMT S5.2 Diagnostics Sidecar

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'RimMT-S5.2-NoResult-Diagnostics/**'
      - '.github/workflows/build-rimmt-s52-diagnostics.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RimMT-S5.2-NoResult-Diagnostics/Source/RimMTS52Diagnostics/RimMTS52Diagnostics.csproj

      - name: Build Release
        run: dotnet build RimMT-S5.2-NoResult-Diagnostics/Source/RimMTS52Diagnostics/RimMTS52Diagnostics.csproj --configuration Release --no-restore

      - name: Verify assembly
        shell: pwsh
        run: |
          $dll = 'RimMT-S5.2-NoResult-Diagnostics/1.5/Assemblies/RimMTS52Diagnostics.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package sidecar
        shell: pwsh
        run: |
          $src = 'RimMT-S5.2-NoResult-Diagnostics'
          $stage = 'build/RimMT-S5.2-NoResult-Diagnostics'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src/About" $stage -Recurse
          Copy-Item "$src/1.5" $stage -Recurse
          Copy-Item "$src/LoadFolders.xml" $stage
          Compress-Archive -Path $stage -DestinationPath 'build/RimMT_V0.4.19_JS1.1S5.2_NoResult_Origin_Diagnostics_Sidecar.zip' -Force

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-S5.2-NoResult-Origin-Diagnostics-Sidecar
          path: build/RimMT_V0.4.19_JS1.1S5.2_NoResult_Origin_Diagnostics_Sidecar.zip
          if-no-files-found: error

      - name: Publish downloadable artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist-artifacts' | Out-Null
          Copy-Item 'build/RimMT_V0.4.19_JS1.1S5.2_NoResult_Origin_Diagnostics_Sidecar.zip' 'dist-artifacts/RimMT_V0.4.19_JS1.1S5.2_NoResult_Origin_Diagnostics_Sidecar.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add 'dist-artifacts/RimMT_V0.4.19_JS1.1S5.2_NoResult_Origin_Diagnostics_Sidecar.zip'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Build RimMT S5.2 NoResult diagnostics sidecar'
          git push
