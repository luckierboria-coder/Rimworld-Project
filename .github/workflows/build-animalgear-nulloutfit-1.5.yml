name: Build Animal Gear Null Outfit 1.5

on:
  push:
    branches: [ main ]
    paths:
      - 'AnimalGear-NullOutfit-1.5/**'
      - '.github/workflows/build-animalgear-nulloutfit-1.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AnimalGear-NullOutfit-1.5/Source/AnimalGearNullOutfit15.csproj

      - name: Build Release
        run: dotnet build AnimalGear-NullOutfit-1.5/Source/AnimalGearNullOutfit15.csproj --configuration Release --no-restore

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = 'AnimalGear-NullOutfit-1.5\1.5\Assemblies\AnimalGearNullOutfit15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled hotfix DLL missing.' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package
        shell: pwsh
        run: |
          $stage = 'build\AnimalGear_NullOutfit_HumanGuard_1.5'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'AnimalGear-NullOutfit-1.5\About' $stage -Recurse -Force
          Copy-Item 'AnimalGear-NullOutfit-1.5\Languages' $stage -Recurse -Force
          Copy-Item 'AnimalGear-NullOutfit-1.5\Patches' $stage -Recurse -Force
          Copy-Item 'AnimalGear-NullOutfit-1.5\1.5' $stage -Recurse -Force
          $readme = @(
            'Animal Gear - Null Outfit & Human Guard 1.5 v2',
            '',
            'Load after Animal Gear and Animal Equipment.',
            '',
            'Behavior:',
            '- Player animals default to None / 无方案.',
            '- None / 无方案 is a permanent animal-only outfit selector entry and can always be selected again after choosing another policy by mistake.',
            '- Colonist outfit UI and policies are untouched; colonists never see this option.',
            '- While None / 无方案 is selected, JobGiver_OptimizeApparel is skipped for that animal, so it does not search for, optimize, replace, or automatically wear apparel.',
            '- Selecting a normal apparel policy re-enables Animal Gear apparel optimization normally.',
            '- On the first load of an existing save, player animals still using the vanilla default Anything policy are migrated once to None. Custom animal policies are preserved.',
            '- After that one-time migration, explicitly selecting Anything remains respected.',
            '- Strict apparel with the Animal tag is removed from human defaultOutfitTags.',
            '- Humanlike pawns cannot wear strict Animal-tagged apparel through ApparelUtility.HasPartsToWear.',
            '- After starting-apparel generation, any strict Animal-tagged apparel directly injected onto a Humanlike pawn is removed as a final safeguard.',
            '- Shared/AnimalCompatible equipment is not blocked; only strict Animal-tagged apparel is guarded.'
          )
          $readme | Set-Content "$stage\README.txt" -Encoding UTF8
          Compress-Archive -Path $stage -DestinationPath 'build\AnimalGear_NullOutfit_HumanGuard_1.5_v2_DLL_READY.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalGear-NullOutfit-HumanGuard-1.5-v2-DLL-READY
          path: build/AnimalGear_NullOutfit_HumanGuard_1.5_v2_DLL_READY.zip
          if-no-files-found: error

      - name: Publish stable ZIP to repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist-artifacts' | Out-Null
          Copy-Item 'build\AnimalGear_NullOutfit_HumanGuard_1.5_v2_DLL_READY.zip' 'dist-artifacts\AnimalGear_NullOutfit_HumanGuard_1.5_v2_DLL_READY.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'dist-artifacts/AnimalGear_NullOutfit_HumanGuard_1.5_v2_DLL_READY.zip'
          if (git diff --cached --quiet) {
            Write-Host 'Published ZIP is already current.'
          } else {
            git commit -m 'Publish Animal Gear Null Outfit Human Guard 1.5 v2 build'
            git push
          }
