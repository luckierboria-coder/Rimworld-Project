name: Dump RimWorld 1.5 Render API

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dump-rimworld-1.5-render-api.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore RimWorld 1.5 refs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net472</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="Krafs.Rimworld.Ref" Version="1.5.4063" /></ItemGroup>
          </Project>
          '@ | Set-Content probe/probe.csproj -Encoding UTF8
          dotnet restore probe/probe.csproj
          dotnet tool install --global ilspycmd
      - name: Decompile render classes
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$env:USERPROFILE\.nuget\packages\krafs.rimworld.ref\1.5.4063" -Recurse -Filter Assembly-CSharp.dll | Select-Object -First 1 -ExpandProperty FullName
          if (!$dll) { throw 'Assembly-CSharp.dll not found in Krafs.Rimworld.Ref.' }
          "ASSEMBLY=$dll" | Set-Content render-api.txt -Encoding UTF8
          foreach ($t in @('Verse.PawnRenderTree','Verse.PawnRenderNode','Verse.PawnRenderNodeProperties')) {
            "`n===== $t =====" | Add-Content render-api.txt
            ilspycmd -t $t $dll | Add-Content render-api.txt
          }
          Get-Content render-api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RimWorld-1.5.4063-render-api
          path: render-api.txt
