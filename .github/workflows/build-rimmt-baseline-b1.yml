name: Build RimMT V0.9.1 Baseline B1

on:
  push:
    branches: [ rimmt-v0.9.1-baseline-b1 ]
    paths:
      - 'RimMT-Baseline-B1/**'
      - '.github/workflows/build-rimmt-baseline-b1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RimMT-Baseline-B1/Source/RimMTBaselineGuard/RimMTBaselineGuard.csproj
      - name: Build
        run: dotnet build RimMT-Baseline-B1/Source/RimMTBaselineGuard/RimMTBaselineGuard.csproj -c Release --no-restore
      - name: Verify
        shell: pwsh
        run: |
          $dll='RimMT-Baseline-B1/1.5/Assemblies/RimMT.BaselineGuard.dll'
          if (!(Test-Path $dll)) { throw "missing $dll" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.1-Baseline-B1-Guard
          path: RimMT-Baseline-B1/1.5/Assemblies/RimMT.BaselineGuard.dll
          if-no-files-found: error
