name: Build Coinage DLL XML patcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-coinage-dll.yml'

permissions:
  contents: read

jobs:
  build-patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create Cecil patcher
        shell: bash
        run: |
          mkdir -p patcher
          cat > patcher/patcher.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.5" />
            </ItemGroup>
          </Project>
          EOF

          cat > patcher/Program.cs <<'EOF'
          using System.Security.Cryptography;
          using Mono.Cecil;
          using Mono.Cecil.Cil;

          static int? ReadInt32(Instruction i) => i.OpCode.Code switch
          {
              Code.Ldc_I4_M1 => -1,
              Code.Ldc_I4_0 => 0,
              Code.Ldc_I4_1 => 1,
              Code.Ldc_I4_2 => 2,
              Code.Ldc_I4_3 => 3,
              Code.Ldc_I4_4 => 4,
              Code.Ldc_I4_5 => 5,
              Code.Ldc_I4_6 => 6,
              Code.Ldc_I4_7 => 7,
              Code.Ldc_I4_8 => 8,
              Code.Ldc_I4_S => (sbyte)i.Operand,
              Code.Ldc_I4 => (int)i.Operand,
              _ => null
          };

          static string Sha(string p)
          {
              using var s = File.OpenRead(p);
              return Convert.ToHexString(SHA256.HashData(s)).ToLowerInvariant();
          }

          if (args.Length != 2)
              throw new Exception("usage: CoinageXmlPatcher <input Coinage.dll> <output Coinage.dll>");

          string input = args[0];
          string output = args[1];

          Console.WriteLine("Original SHA256=" + Sha(input));

          var asm = AssemblyDefinition.ReadAssembly(input, new ReaderParameters
          {
              ReadSymbols = false,
              InMemory = true
          });
          var module = asm.MainModule;

          var util = module.Types.FirstOrDefault(t => t.FullName == "Coinage.CoinageUtility")
              ?? throw new Exception("Coinage.CoinageUtility not found.");
          var gen = util.Methods.FirstOrDefault(m => m.Name == "CoinDefGenerator")
              ?? throw new Exception("CoinDefGenerator not found.");

          if (util.Methods.Any(m => m.Name == "GetCoinOutputCountFromRecipe"))
              throw new Exception("DLL already appears patched.");

          var gameRef = module.AssemblyReferences.FirstOrDefault(a => a.Name == "Assembly-CSharp")
              ?? throw new Exception("Assembly-CSharp reference not found.");

          var recipeDefType = new TypeReference("Verse", "RecipeDef", module, gameRef, false);
          var defDbOpen = new TypeReference("Verse", "DefDatabase\u00601", module, gameRef, false);
          var defDbRecipe = new GenericInstanceType(defDbOpen);
          defDbRecipe.GenericArguments.Add(recipeDefType);

          var getNamed = new MethodReference("GetNamed", recipeDefType, defDbRecipe)
          {
              HasThis = false
          };
          getNamed.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
          getNamed.Parameters.Add(new ParameterDefinition(module.TypeSystem.Boolean));

          var targetCount = new FieldReference("targetCountAdjustment", module.TypeSystem.Int32, recipeDefType);

          var helper = new MethodDefinition(
              "GetCoinOutputCountFromRecipe",
              MethodAttributes.Private | MethodAttributes.Static | MethodAttributes.HideBySig,
              module.TypeSystem.Int32);
          util.Methods.Add(helper);

          var hp = helper.Body.GetILProcessor();
          hp.Append(hp.Create(OpCodes.Ldstr, "Mill_Coinage"));
          hp.Append(hp.Create(OpCodes.Ldc_I4_1));
          hp.Append(hp.Create(OpCodes.Call, getNamed));
          hp.Append(hp.Create(OpCodes.Ldfld, targetCount));
          hp.Append(hp.Create(OpCodes.Ret));

          var ins = gen.Body.Instructions;
          int patched = 0;

          for (int i = 0; i < ins.Count - 1; i++)
          {
              if (ReadInt32(ins[i]) != 50)
                  continue;

              int j = i + 1;
              while (j < ins.Count && ins[j].OpCode == OpCodes.Nop)
                  j++;

              if (j >= ins.Count || ins[j].OpCode != OpCodes.Newobj)
                  continue;
              if (ins[j].Operand is not MethodReference ctor)
                  continue;
              if (ctor.DeclaringType.FullName != "Verse.ThingDefCountClass")
                  continue;

              ins[i].OpCode = OpCodes.Call;
              ins[i].Operand = helper;
              patched++;

              Console.WriteLine($"PATCHED instruction {i}: hardcoded 50 -> Mill_Coinage.targetCountAdjustment");
          }

          if (patched != 1)
              throw new Exception($"Expected exactly one Coinage mint-output hardcode site; patched={patched}.");

          Directory.CreateDirectory(Path.GetDirectoryName(Path.GetFullPath(output))!);
          asm.Write(output, new WriterParameters { WriteSymbols = false });

          var check = AssemblyDefinition.ReadAssembly(output, new ReaderParameters { ReadSymbols = false });
          var checkUtil = check.MainModule.Types.First(t => t.FullName == "Coinage.CoinageUtility");
          var checkHelper = checkUtil.Methods.Single(m => m.Name == "GetCoinOutputCountFromRecipe");
          var checkGen = checkUtil.Methods.Single(m => m.Name == "CoinDefGenerator");

          bool helperReadsRecipe =
              checkHelper.Body.Instructions.Any(x => x.OpCode == OpCodes.Ldstr && (string)x.Operand == "Mill_Coinage")
              && checkHelper.Body.Instructions.Any(x =>
                  x.OpCode == OpCodes.Ldfld && x.Operand is FieldReference f && f.Name == "targetCountAdjustment");

          bool generatorCallsHelper =
              checkGen.Body.Instructions.Any(x =>
                  x.OpCode == OpCodes.Call && x.Operand is MethodReference m && m.Name == "GetCoinOutputCountFromRecipe");

          bool hardcoded50AtProductCtor = false;
          var ci = checkGen.Body.Instructions;
          for (int i = 0; i < ci.Count - 1; i++)
          {
              if (ReadInt32(ci[i]) != 50) continue;
              int j = i + 1;
              while (j < ci.Count && ci[j].OpCode == OpCodes.Nop) j++;
              if (j < ci.Count && ci[j].OpCode == OpCodes.Newobj &&
                  ci[j].Operand is MethodReference c &&
                  c.DeclaringType.FullName == "Verse.ThingDefCountClass")
              {
                  hardcoded50AtProductCtor = true;
              }
          }

          if (!helperReadsRecipe || !generatorCallsHelper || hardcoded50AtProductCtor)
              throw new Exception("Post-write IL verification failed.");

          Console.WriteLine("Patched SHA256=" + Sha(output));
          Console.WriteLine("VERIFY output count source: RecipeDef Mill_Coinage.targetCountAdjustment");
          Console.WriteLine("VERIFY ingredient cost source unchanged: Recipes_Coinage.xml ingredient count");
          EOF

      - name: Publish self-contained Linux patcher
        run: dotnet publish patcher/patcher.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload patcher
        uses: actions/upload-artifact@v4
        with:
          name: CoinageXmlPatcher-linux-x64
          path: publish/
          if-no-files-found: error
