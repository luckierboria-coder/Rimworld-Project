name: Build Ideology Delete UI 1.5

on:
  pull_request:
    paths:
      - 'Ideology-Delete-UI-1.5/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Ideology-Delete-UI-1.5/Source/IdeologyDeleteUI.csproj
      - name: Build
        run: dotnet build Ideology-Delete-UI-1.5/Source/IdeologyDeleteUI.csproj -c Release --no-restore
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out
          mkdir -p out/Ideology_Delete_UI_1.5/1.5/Assemblies
          mkdir -p out/Ideology_Delete_UI_1.5/About
          cp Ideology-Delete-UI-1.5/Source/bin/Release/net472/IdeologyDeleteUI.dll out/Ideology_Delete_UI_1.5/1.5/Assemblies/
          cp Ideology-Delete-UI-1.5/About/About.xml out/Ideology_Delete_UI_1.5/About/
          cp Ideology-Delete-UI-1.5/README.md out/Ideology_Delete_UI_1.5/
          cd out
          zip -r Ideology_Delete_UI_1.5.zip Ideology_Delete_UI_1.5
      - uses: actions/upload-artifact@v4
        with:
          name: Ideology_Delete_UI_1.5
          path: |
            out/Ideology_Delete_UI_1.5.zip
            out/Ideology_Delete_UI_1.5/1.5/Assemblies/IdeologyDeleteUI.dll
