name: Build LTS Ammo Inventory System 1.5

on:
  push:
    branches: [ main ]
    paths:
      - 'LTS-Ammunition-Inventory-Fallback-1.5/**'
      - '.github/workflows/build-lts-ammo-inventory-fallback-1.5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore LTS-Ammunition-Inventory-Fallback-1.5/Source/LTSAmmoInventoryFallback15.csproj
      - name: Build Release
        run: dotnet build LTS-Ammunition-Inventory-Fallback-1.5/Source/LTSAmmoInventoryFallback15.csproj --configuration Release --no-restore
      - name: Verify and package
        shell: pwsh
        run: |
          $dll = 'LTS-Ammunition-Inventory-Fallback-1.5\1.5\Assemblies\LTSAmmoInventoryFallback15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL missing.' }
          Remove-Item 'dist' -Recurse -Force -ErrorAction SilentlyContinue
          $stage = 'dist\LTS-Ammunition-Inventory-System-1.5'
          New-Item -ItemType Directory -Force -Path "$stage\About" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Assemblies" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Defs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Patches" | Out-Null
          Copy-Item 'LTS-Ammunition-Inventory-Fallback-1.5\About\About.xml' "$stage\About\About.xml"
          Copy-Item $dll "$stage\1.5\Assemblies\LTSAmmoInventoryFallback15.dll"
          Copy-Item 'LTS-Ammunition-Inventory-Fallback-1.5\1.5\Defs\*.xml' "$stage\1.5\Defs\"
          Copy-Item 'LTS-Ammunition-Inventory-Fallback-1.5\1.5\Patches\*.xml' "$stage\1.5\Patches\"
          Copy-Item 'LTS-Ammunition-Inventory-Fallback-1.5\LoadFolders.xml' "$stage\LoadFolders.xml"
          Copy-Item 'LTS-Ammunition-Inventory-Fallback-1.5\README_CN.txt' "$stage\README_CN.txt"
          $files = Get-ChildItem $stage -Recurse -File
          if ($files.Name -contains '0Harmony.dll') { throw 'Dependency DLL leaked into package.' }
          if ($files.Name -match '\.pdb$') { throw 'PDB leaked into package.' }
          Compress-Archive -Path $stage -DestinationPath 'dist\LTS-Ammunition-Inventory-System-1.5.zip' -Force
      - name: Upload patch zip
        uses: actions/upload-artifact@v4
        with:
          name: LTS-Ammunition-Inventory-System-1.5
          path: dist/LTS-Ammunition-Inventory-System-1.5.zip
          if-no-files-found: error
