name: Materialize RimMT2 M1.1.5 source into GitHub
on:
  push:
    branches: [rimmt2-m1-1-4-continuation-20261017]
    paths:
      - '.github/workflows/materialize-rimmt2-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: rimmt2-m1-1-4-continuation-20261017
          persist-credentials: true
      - name: Verify and recover uploaded M1.1.5 project files
        shell: bash
        run: |
          set -euo pipefail
          test -s RimMT2/source-archive/rimmt2_m115_source_only.tar.xz.b64
          base64 -d RimMT2/source-archive/rimmt2_m115_source_only.tar.xz.b64 > /tmp/rimmt2-m115.tar.xz
          echo '129f28f4780e8a2e04875fcb84bd45df41b6fb7de0af00876d2ab151ab62dfa5  /tmp/rimmt2-m115.tar.xz' | sha256sum -c -
          tar -xJf /tmp/rimmt2-m115.tar.xz -C RimMT2
          test -f RimMT2/Source/RimMT2/RimMT2.csproj
          grep -q 'unknownCallerRecentTop' RimMT2/Source/RimMT2/Diagnostics/JobSearchCensus.cs
          grep -q 'M1.1.5' RimMT2/Source/RimMT2/Diagnostics/StatusReporter.cs
          python3 - <<'PY'
          from pathlib import Path
          f=Path("RimMT2/About/About.xml")
          s=f.read_text(encoding="utf-8")
          assert "<modVersion>2.0.0-m1.1.4</modVersion>" in s
          s=s.replace("<modVersion>2.0.0-m1.1.4</modVersion>","<modVersion>2.0.0-m1.1.5</modVersion>")
          s=s.replace("RimMT 2.0 M1.1 - WorkGiver Census","RimMT 2.0 M1.1.5 - Rolling Caller Census")
          f.write_text(s,encoding="utf-8")
          PY
          mkdir -p RimMT2/CI RimMT2/Build
          cat > RimMT2/CI/RimMT2.CI.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <AssemblyName>RimMT2</AssemblyName>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <Deterministic>true</Deterministic>
              <DebugType>portable</DebugType>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../Source/RimMT2/**/*.cs" Exclude="../Source/RimMT2/**/bin/**;../Source/RimMT2/**/obj/**" />
              <PackageReference Include="Krafs.Rimworld.Ref" Version="1.6.4871" ExcludeAssets="runtime" />
              <PackageReference Include="Lib.Harmony" Version="2.3.3" ExcludeAssets="runtime" />
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net472" Version="1.0.3" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          XML
          cat > RimMT2/Build/Build.ps1 <<'PS1'
          # Native local build against the user's licensed RimWorld 1.6 installation.
          # Requires the .NET SDK already installed on the user's computer.
          $ErrorActionPreference = 'Stop'
          $Root = Split-Path -Parent $PSScriptRoot
          $Project = Join-Path $Root 'Source\RimMT2\RimMT2.csproj'
          $ManagedDir = $env:RIMWORLD_MANAGED_DIR
          $HarmonyDll = $env:RIMMT_HARMONY_DLL
          if (-not $ManagedDir -or -not (Test-Path -LiteralPath (Join-Path $ManagedDir 'Assembly-CSharp.dll')) -or
              -not (Test-Path -LiteralPath (Join-Path $ManagedDir 'UnityEngine.CoreModule.dll'))) {
              throw 'Set RIMWORLD_MANAGED_DIR to RimWorld 1.6 RimWorldWin64_Data\Managed.'
          }
          if (-not $HarmonyDll -or -not (Test-Path -LiteralPath $HarmonyDll)) {
              throw 'Set RIMMT_HARMONY_DLL to installed Harmony 0Harmony.dll.'
          }
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
              throw 'A .NET SDK is required. This script never downloads/installs it.'
          }
          dotnet build $Project -c Release -p:RimWorldManagedDir="$ManagedDir" -p:RimMTHarmonyDll="$HarmonyDll" -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          $Dll = Join-Path $Root '1.6\Assemblies\RimMT2.dll'
          $Hash = (Get-FileHash -LiteralPath $Dll -Algorithm SHA256).Hash
          Write-Host "RIMMT2_BUILD_OK $Dll SHA256=$Hash"
          PS1
          cat > RimMT2/.gitignore <<'IGNORE'
          **/bin/
          **/obj/
          1.6/Assemblies/
          *.user
          *.suo
          IGNORE
          cat > RimMT2/BUILDING.md <<'DOC'
          # RimMT 2.0 M1.1.5 — complete source and local build
          
          All editable C# source is under `Source/RimMT2/`. `About/` and `LoadFolders.xml` are the RimWorld mod metadata. This is the independent RimWorld 1.6 / packageId `allen.rimmt2` project, **not** old `RimMT/` for 1.5.
          
          ## Option A — portable local build (recommended)
          
          Prerequisite: **.NET SDK 8 or later** installed, rather than only the .NET runtimes. From the repository root, in PowerShell or cmd.exe:
          
          ```powershell
          dotnet --list-sdks
          dotnet build RimMT2/CI/RimMT2.CI.csproj -c Release
          ```
          
          Output: `RimMT2/CI/bin/Release/net472/RimMT2.dll`. The portable project uses NuGet reference packages for RimWorld 1.6.4871, Harmony, and .NET Framework 4.7.2; it does not redistribute the game assemblies and does not require copying local game DLLs. It is the same source set and project structure used by CI.
          
          ## Option B — build against your actual RimWorld installation
          
          Set both environment variables to existing file locations and run the native `net48` project:
          
          ```powershell
          $env:RIMWORLD_MANAGED_DIR = 'D:\Rimworld\RimWorld.v1.6.4871\RimWorldWin64_Data\Managed'
          $env:RIMMT_HARMONY_DLL = 'D:\Rimworld\RimWorld.v1.6.4871\Mods\1446523594\1.6\Assemblies\0Harmony.dll'
          ./RimMT2/Build/Build.ps1
          ```
          
          Adjust Harmony's path to wherever `0Harmony.dll` is actually installed. Native output: `RimMT2/1.6/Assemblies/RimMT2.dll`. Both methods require a local SDK; `dotnet --list-runtimes` does not mean an SDK is installed.
          
          ## Install and verification
          
          Copy the freshly compiled DLL to `<your RimMT2 mod folder>/1.6/Assemblies/RimMT2.dll`; copy `About/About.xml` and `LoadFolders.xml` from this repo to the corresponding root locations. Fully exit the game first. On restart, confirm the `[RimMT 2.0 M1.1.5]` bootstrap log. M1.1.5 only changes rolling diagnostics; it does not yet submit live search work to workers. Compilation does not prove game-side performance or compatibility.
          
          The previous encoded archive under `source-archive/` is retained temporarily for provenance. Do not build from it: **build the checked-in `.cs` files directly**.
          DOC
          echo "Recovered $(find RimMT2/Source/RimMT2 -type f | wc -l) project source files"
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build directly from actual source and validate
        shell: bash
        run: |
          set -euo pipefail
          dotnet build RimMT2/CI/RimMT2.CI.csproj -c Release --nologo
          test -s RimMT2/CI/bin/Release/net472/RimMT2.dll
          grep -q '<modVersion>2.0.0-m1.1.5</modVersion>' RimMT2/About/About.xml
          echo "Verified direct-source DLL:"
          sha256sum RimMT2/CI/bin/Release/net472/RimMT2.dll
      - name: Commit C# source and editable local build project to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RimMT2/Source RimMT2/About/About.xml RimMT2/LoadFolders.xml RimMT2/CI/RimMT2.CI.csproj RimMT2/Build/Build.ps1 RimMT2/BUILDING.md RimMT2/.gitignore
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Source files already committed."
          else
            git commit -m "Import editable RimMT2 M1.1.5 source and local build projects"
            git push origin "HEAD:refs/heads/rimmt2-m1-1-4-continuation-20261017"
          fi
