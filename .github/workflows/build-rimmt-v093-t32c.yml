name: Build RimMT V0.9.3-T32C Positive CanReserve Shadow

on:
  push:
    branches:
      - rimmt-v0.9.3-t32c-positive-canreserve-shadow
  pull_request:
    branches:
      - rimmt-v0.9.3-t32b1-adaptive-forbidden-fingerprint
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t32c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T32-C
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT32C.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T32C-Positive-CanReserve-Shadow
          path: |
            build/RimMT_V0.9.3_T32C_Production.zip
            build/RimMT_Diagnostics_v0.13.zip
            build/RimMT_T32C_With_Diagnostics_Bundle.zip
          if-no-files-found: error
