name: Build RimMT V0.9.3-T27.2 Safety Layer Reset

on:
  push:
    branches: [ rimmt-v0.9.3-t27.2-safety-layer-reset ]
    paths:
      - 'RimMT/**'
      - '.github/workflows/build-rimmt-v093-t27-2.yml'
  workflow_dispatch:

concurrency:
  group: rimmt-v093-t27-2-safety-layer-reset
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify T27.2
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT27_2.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-V0.9.3-T27.2-Safety-Layer-Reset
          path: build/RimMT_V0.9.3_T27.2_Safety_Layer_Reset.zip
          if-no-files-found: error
