name: Export RimMT Source Recovery

on:
  push:
    branches: [ rimmt-v0.9.0-rc1 ]
    paths:
      - '.github/workflows/export-rimmt-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export current RC1 source tree
        uses: actions/upload-artifact@v4
        with:
          name: rimmt-rc1-source-tree
          path: RimMT/Source/RimMT
          include-hidden-files: true
          if-no-files-found: error
