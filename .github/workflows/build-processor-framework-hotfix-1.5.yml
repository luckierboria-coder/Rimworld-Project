name: Build Processor Framework Hotfix 1.5 v0.1.3

on:
  push:
    branches: [ rimmt-v0.9.2-unified-lean ]
    paths:
      - 'Processor-Framework-Hotfix-1.5/**'
      - '.github/workflows/build-processor-framework-hotfix-1.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Processor-Framework-Hotfix-1.5/Source/ProcessorFrameworkHotfix15.csproj

      - name: Build Release
        run: dotnet build Processor-Framework-Hotfix-1.5/Source/ProcessorFrameworkHotfix15.csproj --configuration Release --no-restore

      - name: Verify DLL and package
        shell: pwsh
        run: |
          $dll = 'Processor-Framework-Hotfix-1.5\1.5\Assemblies\ProcessorFrameworkHotfix15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled hotfix DLL missing.' }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          $stage = 'build\Processor Framework Hotfix 1.5'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'Processor-Framework-Hotfix-1.5\About' $stage -Recurse -Force
          Copy-Item 'Processor-Framework-Hotfix-1.5\1.5' $stage -Recurse -Force
          Copy-Item 'Processor-Framework-Hotfix-1.5\LoadFolders.xml' $stage -Force
          Copy-Item 'Processor-Framework-Hotfix-1.5\README.md' "$stage\README.md" -Force
          $dlls = Get-ChildItem $stage -Recurse -Filter *.dll
          if ($dlls.Count -ne 1) { throw "Expected exactly one DLL in package, found $($dlls.Count)." }
          Compress-Archive -Path $stage -DestinationPath 'build\Processor_Framework_Hotfix_1.5_v0.1.3_Reservation_Safe.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Processor-Framework-Hotfix-1.5-v0.1.3-Reservation-Safe
          path: build/Processor_Framework_Hotfix_1.5_v0.1.3_Reservation_Safe.zip
          if-no-files-found: error

      - name: Publish stable ZIP to repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist-artifacts' | Out-Null
          Copy-Item 'build\Processor_Framework_Hotfix_1.5_v0.1.3_Reservation_Safe.zip' 'dist-artifacts\Processor_Framework_Hotfix_1.5_v0.1.3_Reservation_Safe.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'dist-artifacts/Processor_Framework_Hotfix_1.5_v0.1.3_Reservation_Safe.zip'
          if (git diff --cached --quiet) {
            Write-Host 'Published ZIP is already current.'
          } else {
            git commit -m 'Publish Processor Framework Hotfix 1.5 v0.1.3 Reservation Safe build'
            git push
          }
