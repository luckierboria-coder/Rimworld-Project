name: Build LargePawns CAI Startup Hotfix

on:
  push:
    branches:
      - rimmt-v0.9.3-t35b-burst-diagnostics-largepawns-guard
    paths:
      - 'LargePawnsCaiStartupHotfix/**'
      - '.github/workflows/build-rimmt-t35b-largepawns-guard.yml'
      - 'NuGet.Config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: largepawns-cai-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use GitHub-hosted .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore LargePawnsCaiStartupHotfix/Source/LargePawnsCaiStartupHotfix/LargePawnsCaiStartupHotfix.csproj

      - name: Build and package
        shell: pwsh
        run: ./LargePawnsCaiStartupHotfix/Build/BuildLargePawnsCaiStartupHotfix.ps1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LargePawns-CAI-Startup-Hotfix
          path: build/LargePawns_CAI_Startup_Hotfix_1.5_V1.0.zip
          if-no-files-found: error
