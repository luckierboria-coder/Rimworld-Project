name: Build RimMT V0.9.3-T32C1 Positive CanReserve Replay

on:
  push:
    branches:
      - rimmt-v0.9.3-t32c1-positive-canreserve-replay
  pull_request:
    branches:
      - rimmt-v0.9.3-t32c-positive-canreserve-shadow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t32c1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T32-C.1
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT32C1.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T32C1-Positive-CanReserve-Replay
          path: |
            build/RimMT_V0.9.3_T32C1_Production.zip
            build/RimMT_Diagnostics_v0.14.zip
            build/RimMT_T32C1_With_Diagnostics_Bundle.zip
          if-no-files-found: error
