name: Build RimMT V0.9.3-T33A Candidate Rejection Census

on:
  push:
    branches:
      - rimmt-v0.9.3-t33a-candidate-rejection-census
  pull_request:
    branches:
      - rimmt-v0.9.3-t32c1-positive-canreserve-replay
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t33a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T33-A
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT33A.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T33A-Candidate-Rejection-Census
          path: |
            build/RimMT_V0.9.3_T32C1_Production.zip
            build/RimMT_Diagnostics_v0.15_T33A.zip
            build/RimMT_T33A_Census_Bundle.zip
          if-no-files-found: error
