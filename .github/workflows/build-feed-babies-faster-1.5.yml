name: Build Feed Babies Faster 1.5

on:
  push:
    branches: [ main ]
    paths:
      - 'Feed-Babies-Faster-1.5-Backport/**'
      - '.github/workflows/build-feed-babies-faster-1.5.yml'
      - '.github/actions/setup-rw15-dotnet/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup RimWorld 1.5 build environment
        uses: ./.github/actions/setup-rw15-dotnet

      - name: Restore
        run: dotnet restore Feed-Babies-Faster-1.5-Backport/Source/FeedBabiesFaster15.csproj

      - name: Build
        run: dotnet build Feed-Babies-Faster-1.5-Backport/Source/FeedBabiesFaster15.csproj --configuration Release --no-restore

      - name: Verify and package
        shell: pwsh
        run: |
          $dll = 'Feed-Babies-Faster-1.5-Backport\1.5\Assemblies\FeedBabiesFaster15.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL missing.' }

          Remove-Item 'dist-feed-babies-faster15' -Recurse -Force -ErrorAction SilentlyContinue
          $stage = 'dist-feed-babies-faster15\Feed-Babies-Faster-1.5-Backport'

          New-Item -ItemType Directory -Force -Path "$stage\About" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\1.5\Assemblies" | Out-Null

          Copy-Item 'Feed-Babies-Faster-1.5-Backport\About\About.xml' "$stage\About\About.xml"
          Copy-Item 'Feed-Babies-Faster-1.5-Backport\README_CN.txt' "$stage\README_CN.txt"
          Copy-Item $dll "$stage\1.5\Assemblies\FeedBabiesFaster15.dll"

          $files = Get-ChildItem $stage -Recurse -File
          if ($files.Name -contains '0Harmony.dll') { throw 'Harmony DLL leaked into package.' }
          if ($files.Name -match '\.pdb$') { throw 'PDB leaked into package.' }

          $hash = (Get-FileHash "$stage\1.5\Assemblies\FeedBabiesFaster15.dll" -Algorithm SHA256).Hash
          Set-Content -Path "$stage\SHA256.txt" -Value "FeedBabiesFaster15.dll SHA256: $hash" -Encoding UTF8

          Compress-Archive -Path $stage -DestinationPath 'dist-feed-babies-faster15\Feed-Babies-Faster-1.5-Backport.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feed-Babies-Faster-1.5-Backport
          path: dist-feed-babies-faster15/Feed-Babies-Faster-1.5-Backport.zip
          if-no-files-found: error
