name: Build Fight Fires With Water 1.5 Backport
on:
  push:
    branches: [ fight-fires-with-water-15-ci ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-with-water-15-ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download SteamCMD
        run: |
          mkdir -p steamcmd
          wget -qO steamcmd_linux.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz -C steamcmd
      - name: Download Workshop mods
        run: |
          ./steamcmd/steamcmd.sh +login anonymous +workshop_download_item 294100 3631692625 validate +workshop_download_item 294100 836308268 validate +workshop_download_item 294100 2926675339 validate +quit || true
          ROOT="$HOME/Steam/steamapps/workshop/content/294100"
          for ID in 3631692625 836308268 2926675339; do test -d "$ROOT/$ID"; done
          cp -a "$ROOT/3631692625" workshop_mod
          cp -a "$ROOT/836308268" dbh_mod
          cp -a "$ROOT/2926675339" dbh_medieval_mod
          find dbh_mod -maxdepth 5 -type f | sort > dbh_files.txt
          find dbh_medieval_mod -maxdepth 6 -type f | sort > dbh_medieval_files.txt
      - name: Decompile source DLLs
        run: |
          dotnet tool install ilspycmd --tool-path tools
          mkdir -p decompiled dbh15_decompiled
          DLL=$(find workshop_mod -iname '*.dll' | head -1)
          tools/ilspycmd -p -o decompiled "$DLL"
          DBH15=$(find dbh_mod/1.5 -iname 'BadHygiene.dll' | head -1)
          test -n "$DBH15"
          tools/ilspycmd -p -o dbh15_decompiled "$DBH15"
      - name: Package inspection
        run: |
          zip -qr Fight-Fires-With-Water-dependency-inspection.zip workshop_mod decompiled dbh_mod dbh15_decompiled dbh_medieval_mod dbh_files.txt dbh_medieval_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fight-Fires-With-Water-dependency-inspection
          path: Fight-Fires-With-Water-dependency-inspection.zip
