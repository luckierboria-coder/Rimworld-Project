name: Build Fight Fires With Water 1.5 Backport
on:
  push:
    branches: [ fight-fires-with-water-15-ci ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-with-water-15-ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download SteamCMD
        run: |
          mkdir -p steamcmd
          wget -qO steamcmd_linux.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz -C steamcmd
      - name: Download Workshop mods
        run: |
          ./steamcmd/steamcmd.sh +login anonymous +workshop_download_item 294100 3631692625 validate +workshop_download_item 294100 836308268 validate +workshop_download_item 294100 2926675339 validate +quit || true
          ROOT="$HOME/Steam/steamapps/workshop/content/294100"
          for ID in 3631692625 836308268 2926675339; do test -d "$ROOT/$ID"; done
          cp -a "$ROOT/3631692625" FFWW
          cp -a "$ROOT/836308268" DBH
          cp -a "$ROOT/2926675339" DBHM
      - name: Prepare exact 1.5 compile probe
        run: |
          rm -rf FFWW/1.6
          mkdir -p FFWW/1.5/Assemblies FFWW/1.5/Defs
          cp "$HOME/Steam/steamapps/workshop/content/294100/3631692625/1.6/Defs/Jobs.xml" FFWW/1.5/Defs/Jobs.xml
          rm -f FFWW/Source/RimWorld/FloatMenuOptionProvider_ForceFightFiresWithWater.cs
          cat > FFWW/Source/FloatMenuPatch15.cs <<'EOF'
          using System.Collections.Generic;
          using HarmonyLib;
          using RimWorld;
          using UnityEngine;
          using Verse;
          using Verse.AI;

          namespace FightFiresWithWater
          {
              [HarmonyPatch(typeof(FloatMenuMakerMap), "AddHumanlikeOrders")]
              public static class FloatMenuPatch15
              {
                  [HarmonyPostfix]
                  public static void Postfix(Vector3 clickPos, Pawn pawn, List<FloatMenuOption> opts)
                  {
                      if (pawn == null || pawn.Map == null || opts == null) return;
                      IntVec3 cell = IntVec3.FromVector3(clickPos);
                      if (!cell.InBounds(pawn.Map)) return;
                      Fire fire = null;
                      List<Thing> things = cell.GetThingList(pawn.Map);
                      for (int i = 0; i < things.Count; i++)
                          if (things[i] is Fire f && !f.Destroyed) { fire = f; break; }
                      if (fire == null) return;
                      AcceptanceReport report = PawnCanForceFight(pawn, fire);
                      string label = "ForceFightFireWithWater".Translate();
                      if (report.Accepted)
                      {
                          Fire captured = fire;
                          opts.Add(new FloatMenuOption(label, delegate
                          {
                              Job job = JobMaker.MakeJob(DefDatabase<JobDef>.GetNamed("FightFiresWithWaterForced", true), captured);
                              job.playerForced = true;
                              pawn.jobs.TryTakeOrderedJob(job, JobTag.Misc);
                          }));
                      }
                      else opts.Add(new FloatMenuOption(label + " (" + report.Reason + ")", null));
                  }

                  private static AcceptanceReport PawnCanForceFight(Pawn pawn, Fire fire)
                  {
                      if (pawn.WorkTypeIsDisabled(WorkTypeDefOf.Firefighter))
                          return "IncapableOf".Translate().CapitalizeFirst() + " " + WorkTypeDefOf.Firefighter.gerundLabel;
                      if (!pawn.CanReserveAndReach(fire, PathEndMode.Touch, pawn.NormalMaxDanger(), 1, -1, null, false))
                          return "NoPath".Translate().CapitalizeFirst();
                      if (!fire.Position.InAllowedArea(pawn))
                          return "CannotPrioritizeForbiddenOutsideAllowedArea".Translate();
                      CompWaterCarrier comp = pawn.GetComp<CompWaterCarrier>();
                      if ((comp == null || !comp.HasWater()) && !WorkGiver_FightFiresWithWater.TryFindBestWaterSource(pawn, out LocalTargetInfo _))
                          return "NoWaterSource".Translate();
                      return true;
                  }
              }
          }
          EOF
          cat > FFWW/Source/FightFiresWithWater.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <AssemblyName>FightFiresWithWater</AssemblyName><GenerateAssemblyInfo>False</GenerateAssemblyInfo>
              <TargetFramework>net48</TargetFramework><OutputPath>../1.5/Assemblies/</OutputPath>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath><DebugType>none</DebugType><LangVersion>7.3</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Krafs.Rimworld.Ref" Version="1.5.4063" />
              <Reference Include="0Harmony"><HintPath>../../DBH/1.5/Assemblies/0Harmony.dll</HintPath><Private>False</Private></Reference>
              <Reference Include="BadHygiene"><HintPath>../../DBH/1.5/Assemblies/BadHygiene.dll</HintPath><Private>False</Private></Reference>
            </ItemGroup>
          </Project>
          EOF
      - name: Compile probe
        id: compile
        continue-on-error: true
        run: |
          cd FFWW/Source
          dotnet restore FightFiresWithWater.csproj 2>&1 | tee ../../restore.log
          dotnet build FightFiresWithWater.csproj -c Release --no-restore 2>&1 | tee ../../build.log
      - name: Package probe
        if: always()
        run: |
          mkdir -p diagnostics
          cp restore.log build.log diagnostics/ 2>/dev/null || true
          cp -a FFWW/Source diagnostics/source
          cp -a FFWW/1.5 diagnostics/1.5
          zip -qr FFWW-1.5-compile-probe.zip diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FFWW-1.5-compile-probe
          path: FFWW-1.5-compile-probe.zip
