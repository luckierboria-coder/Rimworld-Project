name: Build Fight Fires With Water 1.5 Backport
on:
  push:
    branches: [ fight-fires-with-water-15-ci ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-with-water-15-ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download SteamCMD
        run: |
          mkdir -p steamcmd
          wget -qO steamcmd_linux.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz -C steamcmd
      - name: Download Workshop mod
        run: |
          ./steamcmd/steamcmd.sh +login anonymous +workshop_download_item 294100 3631692625 validate +quit
          MOD="$HOME/.local/share/Steam/steamapps/workshop/content/294100/3631692625"
          test -d "$MOD"
          find "$MOD" -maxdepth 5 -type f | sort | tee workshop_files.txt
          cp -a "$MOD" workshop_mod
      - name: Decompile DLL
        run: |
          dotnet tool install ilspycmd --tool-path tools
          mkdir -p decompiled
          DLL=$(find workshop_mod -iname '*.dll' | head -1)
          test -n "$DLL"
          echo "DLL=$DLL"
          tools/ilspycmd -p -o decompiled "$DLL"
      - name: Package inspection
        run: |
          zip -qr Fight-Fires-With-Water-original-and-decompiled.zip workshop_mod decompiled workshop_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fight-Fires-With-Water-original-and-decompiled
          path: Fight-Fires-With-Water-original-and-decompiled.zip
