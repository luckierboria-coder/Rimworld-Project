name: Build Fight Fires With Water 1.5 Backport
on:
  push:
    branches: [ fight-fires-with-water-15-ci ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fight-fires-with-water-15-ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download SteamCMD
        run: |
          sudo add-apt-repository multiverse -y
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y steamcmd unzip
      - name: Download Workshop mod
        run: |
          mkdir -p steam
          steamcmd +force_install_dir "$PWD/steam" +login anonymous +workshop_download_item 294100 3631692625 validate +quit
          find "$HOME/.local/share/Steam/steamapps/workshop/content/294100/3631692625" -maxdepth 4 -type f | sort | tee workshop_files.txt
          cp -a "$HOME/.local/share/Steam/steamapps/workshop/content/294100/3631692625" workshop_mod
      - name: Decompile DLL
        run: |
          dotnet tool install ilspycmd --tool-path tools
          mkdir -p decompiled
          DLL=$(find workshop_mod -iname '*.dll' | head -1)
          echo "DLL=$DLL"
          tools/ilspycmd -p -o decompiled "$DLL"
      - name: Package inspection
        run: |
          zip -qr Fight-Fires-With-Water-original-and-decompiled.zip workshop_mod decompiled workshop_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fight-Fires-With-Water-original-and-decompiled
          path: Fight-Fires-With-Water-original-and-decompiled.zip
