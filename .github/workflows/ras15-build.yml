name: Build RaS RimWorld 1.5 Backport

permissions:
  contents: write

on:
  push:
    branches: [ ras-15-build ]
    paths:
      - 'ci/**'
      - '.github/workflows/ras15-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ci/rasov.part*' | Sort-Object Name
          if ($parts.Count -eq 0) { throw 'Missing RaS source payload parts.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('ras_source.zip', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path 'rasbuild' | Out-Null
          Expand-Archive 'ras_source.zip' 'rasbuild' -Force
          $buildScript = Get-ChildItem 'rasbuild' -Recurse -Filter 'Build_All_1.5.ps1' | Select-Object -First 1
          if (!$buildScript) { throw 'Could not locate Build_All_1.5.ps1 after extraction.' }
          $buildRoot = $buildScript.Directory.FullName
          "RAS_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Build root: $buildRoot"

      - name: Build all three DLLs
        shell: pwsh
        run: |
          Set-Location $env:RAS_BUILD_ROOT
          ./Build_All_1.5.ps1 -NoPause

      - name: Verify outputs
        shell: pwsh
        run: |
          $dlls = @(
            (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-1.5/Assemblies/RegionsAndSocieties.dll'),
            (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-VFECP-1.5/Assemblies/RegionsAndSocieties.VFECP.dll'),
            (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-VOECP-1.5/Assemblies/RegionsAndSocieties.VOECP.dll')
          )
          foreach ($dll in $dlls) {
            if (!(Test-Path $dll)) { throw "Missing compiled DLL: $dll" }
            Get-Item $dll | Format-List FullName,Length,LastWriteTime
          }

      - name: Package full install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build/RaS_1.5.4063_Full_Backport' | Out-Null
          Copy-Item (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-1.5') 'build/RaS_1.5.4063_Full_Backport/' -Recurse
          Copy-Item (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-VFECP-1.5') 'build/RaS_1.5.4063_Full_Backport/' -Recurse
          Copy-Item (Join-Path $env:RAS_BUILD_ROOT 'Mods/RegionsAndSocieties-VOECP-1.5') 'build/RaS_1.5.4063_Full_Backport/' -Recurse
          Compress-Archive -Path 'build/RaS_1.5.4063_Full_Backport' -DestinationPath 'build/RaS_1.5.4063_Full_Backport.zip' -Force

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RaS-1.5-build-log
          path: rasbuild/**/BUILD_LOG.txt
          if-no-files-found: ignore

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RaS-1.5.4063-Full-Backport
          path: build/RaS_1.5.4063_Full_Backport.zip
          if-no-files-found: error
