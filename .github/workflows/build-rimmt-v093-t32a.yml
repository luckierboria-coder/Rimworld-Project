name: Build RimMT V0.9.3-T32A Reservation Transaction

on:
  push:
    branches:
      - rimmt-v0.9.3-t32a-reservation-transaction
  pull_request:
    branches:
      - rimmt-v0.9.3-t28-unified-job-search-transaction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t32a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T32-A
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT32A.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T32A-Reservation-Transaction
          path: |
            build/RimMT_V0.9.3_T32A_Production.zip
            build/RimMT_Diagnostics_v0.10.zip
            build/RimMT_T32A_With_Diagnostics_Bundle.zip
          if-no-files-found: error
