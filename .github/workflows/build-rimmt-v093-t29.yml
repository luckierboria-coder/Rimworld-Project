name: Build RimMT V0.9.3-T29 Source Metadata Foundation

on:
  push:
    branches:
      - rimmt-v0.9.3-t29-source-metadata-foundation
  pull_request:
    branches:
      - rimmt-v0.9.3-t28-unified-job-search-transaction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimmt-t29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify T29
        shell: pwsh
        run: ./RimMT/Build/BuildRimMTT29.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimMT-T29-Source-Metadata-Foundation
          path: |
            build/RimMT_V0.9.3_T29_Production.zip
            build/RimMT_Diagnostics_v0.7.zip
            build/RimMT_T29_With_Diagnostics_Bundle.zip
          if-no-files-found: error
