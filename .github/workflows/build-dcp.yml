name: Build Drafted Command Priority V0.2 RimWorld 1.5

on:
  push:
    branches: [ dcp-v0.2-absolute-player-authority ]
    paths:
      - 'DraftedCommandPriority/**'
      - '.github/workflows/build-dcp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch exact RimWorld 1.5 API types
        shell: pwsh
        run: |
          $p = 'DraftedCommandPriority/Source/DraftedCommandPriority/DraftedCommandPriority.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('List<Pawn> pawns = pawn.Map.mapPawns.AllPawnsSpawned;', 'IReadOnlyList<Pawn> pawns = pawn.Map.mapPawns.AllPawnsSpawned;')
          Set-Content $p $s -Encoding UTF8

      - name: Restore
        run: dotnet restore DraftedCommandPriority/Source/DraftedCommandPriority/DraftedCommandPriority.csproj

      - name: Build Release
        run: dotnet build DraftedCommandPriority/Source/DraftedCommandPriority/DraftedCommandPriority.csproj --configuration Release --no-restore

      - name: Verify absolute-authority contract
        shell: pwsh
        run: |
          $src = Get-Content 'DraftedCommandPriority/Source/DraftedCommandPriority/DraftedCommandPriority.cs' -Raw
          foreach ($marker in @('TryTakeOrderedJob','CancelBusyStanceHard','InterruptForced','forceCompleteBeforeNextJob','StartJobAuthorityGate','ThinkTreeCommandGate','playerForced','IsHardControlled','!pawn.Spawned','stunner.Stunned','IReadOnlyList<Pawn>')) {
            if ($src -notmatch [regex]::Escape($marker)) { throw "Missing V0.2 authority marker: $marker" }
          }
          if ($src -match 'InMentalState\)\s*return true;' ) { throw 'Mental state must not be treated as a hard-control exception in V0.2.' }
          $dll = 'DraftedCommandPriority/1.5/Assemblies/DraftedCommandPriority.dll'
          if (!(Test-Path $dll)) { throw "Missing compiled assembly: $dll" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package playtest
        shell: pwsh
        run: |
          $stage = 'build/DraftedCommandPriority'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'DraftedCommandPriority/About' $stage -Recurse
          Copy-Item 'DraftedCommandPriority/Languages' $stage -Recurse
          Copy-Item 'DraftedCommandPriority/1.5' $stage -Recurse
          Copy-Item 'DraftedCommandPriority/README.md' $stage
          Compress-Archive -Path $stage -DestinationPath 'build/DraftedCommandPriority_V0.2_Absolute_Player_Authority.zip' -Force

      - name: Upload playtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftedCommandPriority-V0.2-Absolute-Player-Authority
          path: build/DraftedCommandPriority_V0.2_Absolute_Player_Authority.zip
          if-no-files-found: error
